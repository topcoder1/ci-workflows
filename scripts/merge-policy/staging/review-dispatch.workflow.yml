# INACTIVE TEMPLATE. Install only after independent review and an exact staging
# execution packet. This does not publish acceptance or configure an App.
# Future path: .github/workflows/merge-policy-review-dispatch.yml in the
# repository whose pull requests it reviews (the producer must run in the
# repository whose objects it measures). The repository literals below are the
# staging repository's; a techrecon packet edits them, nothing else.
name: Merge policy review dispatch

on:
  workflow_dispatch:
    # Trusted caller input: only the owner can dispatch this private repository's
    # workflow. Validated by the entrypoint before any Git or credential work;
    # authenticated by the intake against the run and the dispatcher's record.
    inputs:
      pull_request:
        description: "Pull request number under review"
        required: true
        type: string
      head_sha:
        description: "Head commit under review, 40 lower-case hex"
        required: true
        type: string
      base_sha:
        description: "Live base commit the review is bound to, 40 lower-case hex"
        required: true
        type: string
      policy_digest:
        description: "Authority digest of the policy and producer documents, 64 hex"
        required: true
        type: string
      workflow_id:
        description: "This workflow's registered id in the producers document"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merge-policy-review-v3
  cancel-in-progress: false

jobs:
  review-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'topcoder1/techrecon-merge-policy-staging' &&
      github.repository_id == '1364800834' &&
      github.run_attempt == '1' &&
      github.ref == 'refs/tags/merge-policy-review-v3' &&
      github.ref_protected == true &&
      github.sha == github.workflow_sha &&
      github.workflow_ref == 'topcoder1/techrecon-merge-policy-staging/.github/workflows/merge-policy-review-dispatch.yml@refs/tags/merge-policy-review-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The approved producer source is checked out; the commits under review
      # arrive as objects of the same fetch (every branch, full history) and are
      # only ever read by Git plumbing. Nothing checks out pull request content
      # and nothing fetches after this step.
      - name: Checkout approved producer source with every branch's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          check-latest: false
          package-manager-cache: false

      # Inputs reach the entrypoint through the environment only, never
      # interpolated into a shell line. The secret is scoped to this one step.
      - name: Review the dispatched pull request once
        id: review
        env:
          INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_POLICY_DIGEST: ${{ inputs.policy_digest }}
          INPUT_WORKFLOW_ID: ${{ inputs.workflow_id }}
          MERGE_POLICY_REVIEW_API_KEY: ${{ secrets.MERGE_POLICY_REVIEW_API_KEY }}
        run: node .github/scripts/merge-policy-review-dispatch.mjs

      # The receipt: exact bytes, the wire format the intake reads. Its artifact
      # name is what the producers document registers as artifactName.
      - name: Upload the review receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-policy-review-receipt.json
          path: ${{ runner.temp }}/merge-policy-review-dispatch/merge-policy-review-receipt.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1
          include-hidden-files: false

      - name: Upload the non-acceptance dispatch report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-policy-review-dispatch.json
          path: ${{ runner.temp }}/merge-policy-review-dispatch/merge-policy-review-dispatch.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1
          include-hidden-files: false

      - name: Upload bounded failure evidence
        if: ${{ failure() && steps.review.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-policy-review-dispatch-failure.json
          path: |
            ${{ runner.temp }}/merge-policy-review-dispatch/started.json
            ${{ runner.temp }}/merge-policy-review-dispatch/merge-policy-review-dispatch-failure.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1
          include-hidden-files: false
