name: Prettier Autofix

# Reusable workflow that auto-applies `prettier --write` on PR-changed
# markdown and pushes the fix back to the PR branch as a single commit.
#
# Why a separate workflow vs folding write-mode into lint.yml:
#   - lint.yml is intentionally check-only (read-only token, runs on every
#     repo without elevated perms). Mixing write-mode would force every
#     consumer to grant `contents: write` even if they don't want autofix.
#   - This workflow is opt-in per repo via a sibling caller workflow.
#
# Why we require a PAT secret instead of GITHUB_TOKEN:
#   - Pushes authored by GITHUB_TOKEN do NOT trigger downstream
#     `pull_request` workflows (GitHub's anti-recursion guard). The whole
#     point of autofix is that the followup commit re-runs `lint.yml` and
#     it goes green. Without a PAT (or a GitHub App token), the prettier
#     check stays red against the previous SHA even though the new commit
#     is correctly formatted.
#   - Reuses the same `automerge_pat` secret that `claude-author-automerge.yml`
#     consumes — owner-scoped fine-grained PAT with `Contents: r/w +
#     Pull-requests: r/w`. Wire via `secrets: inherit` in the caller.
#     See `runbooks/prettier-autofix.md`.
#
# Skip behavior:
#   - Forks: skipped (cross-repo push not allowed).
#   - Closed PRs: skipped.
#   - Bot-authored PRs (dependabot/renovate): skipped. GitHub withholds
#     Actions secrets from dependabot-triggered runs, so `automerge_pat` is
#     empty and the checkout fails with "Input required and not supplied:
#     token" — a permanent red X on every dependabot PR. Mirrors the
#     bot-skip in claude-review.yml. Dependency bumps don't need autofix.
#   - PRs that touched zero markdown files: skipped (no-op).
#   - Changed-file listing failures (transient API errors): skipped after
#     3 attempts — a scoping failure is never widened to a full-tree run
#     (wxa-secrets#27: the old full-tree fallback reformatted pre-existing
#     drift in files the PR never touched and the push died on workflow
#     scope).
#   - Writes under .github/workflows/ are always reverted before commit:
#     automerge_pat deliberately lacks workflow scope (fleet policy), so
#     GitHub rejects any push containing them.
#   - PRs already cleanly formatted: skipped (no commit pushed).
#
# Untrusted-head hardening (defense in depth — the head is attacker- or
# model-writable, and this workflow runs on `pull_request` the moment the PR
# opens, draft or not, with a PAT in reach):
#   - Prettier NEVER loads config or plugin CODE that the PR head can influence.
#     It always runs `--config <file>` where <file> is materialized off-checkout
#     into $RUNNER_TEMP: the BASE branch's config (`git show <base>:<config>`)
#     when it declares one, else an empty `{}`. `--config` suppresses prettier's
#     upward config search, so a head prettier.config.js / .prettierrc.cjs /
#     package.json "prettier" ref is never executed. The empty-`{}` default is
#     chosen over `--no-config` precisely because `--config` still honors the
#     repo's `.editorconfig` (data-only INI — no code execution), keeping output
#     byte-identical to lint.yml's `prettier --check` and to prettier's
#     pre-hardening default search. A base config that is itself JS/TS, or that
#     names plugins, degrades to the empty `{}` + a ::warning:: — autofix loads
#     no config or plugin JS from head OR base.
#   - The prettier CLI is installed OUTSIDE the checkout (in $RUNNER_TEMP) with
#     a pinned --registry, --ignore-scripts, and a neutralized npm user-config,
#     so the head's package.json and .npmrc can neither run install scripts nor
#     redirect the registry the prettier package resolves from. No `npm ci`
#     ever runs in the checkout. (Mirrors lint.yml's "install from $RUNNER_TEMP,
#     not the checkout" idiom and its checkout-cwd guard.)
#   - Checkout uses `persist-credentials: false`; the PAT is supplied only to
#     the single push via an inline http.extraheader, never written to
#     .git/config where head-reachable code could read it.
#   - The target list is passed after `--`, so a head file literally named
#     `--plugin=x` cannot be reparsed as a prettier flag.
#   Pinned by selftest/test_prettier_untrusted_head_config.sh. Note: this
#   hardens prettier-autofix.yml only; lint.yml's read-only `prettier --check`
#   still loads head config (no PAT there, lower severity) — tracked separately.

on:
  workflow_call:
    inputs:
      markdown_glob:
        description: >-
          Glob passed to prettier --write. Default
          '**/*.{md,yml,yaml,json}' covers markdown, YAML config, and
          JSON (the cheap-to-format file types where prettier's opinion
          is uncontroversial). Mirrors lint.yml's markdown_glob — keep
          both inputs in sync. Input name is historical; the glob
          isn't restricted to markdown anymore. To exclude specific
          files, add them to the repo's `.prettierignore`.
        required: false
        type: string
        default: "**/*.{md,yml,yaml,json}"
      install_node_deps:
        description: >-
          DEPRECATED / no-op, kept so existing callers that pass it do not
          error. Autofix no longer installs the PR head's dependencies: the
          head is untrusted, so prettier runs with base-branch config only and
          loads no plugins from the head. Prettier plugins declared in a
          BASE-branch config are also not loaded (a ::warning:: is emitted).
          The prettier CLI itself is installed off-checkout with a pinned
          registry. This input is ignored.
        required: false
        type: boolean
        default: true
      changed_only:
        description: "Run prettier --write only on files added/modified/renamed in the PR diff (intersected with markdown_glob). Default true. Mirrors lint.yml's prettier_changed_only."
        required: false
        type: boolean
        default: true
      commit_message:
        description: "Subject line for the autofix commit. Default 'style: prettier auto-fix'."
        required: false
        type: string
        default: "style: prettier auto-fix"
    secrets:
      automerge_pat:
        description: >-
          Fine-grained PAT (or classic with `repo` scope) used to push
          the autofix commit. Required — pushes by the default
          GITHUB_TOKEN do not retrigger the lint workflow on the new
          SHA. Same secret name and required scopes as
          `claude-author-automerge.yml`'s `automerge_pat`, so a repo
          that already has auto-merge wired needs no additional
          provisioning. Required scopes: `Contents: read and write`,
          `Pull-requests: read`.
        required: true

jobs:
  autofix:
    name: prettier auto-fix
    runs-on: ubuntu-latest
    # Skip on fork PRs (cross-repo push impossible), closed PRs, and
    # bot-authored PRs (dependabot/renovate runs can't read the PAT secret).
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    permissions:
      # Needed to push the autofix commit. The PAT supplies the actual
      # auth; declaring contents:write here just unblocks the runner.
      contents: write
      # Needed to call `gh api .../pulls/N/files` for the changed-files set.
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          # Check out the PR's head ref (not the merge commit) so our push
          # writes back to the same branch the PR is tracking.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # SECURITY: do NOT persist any token into .git/config. The head is
          # attacker-writable and everything below runs over it. The default
          # GITHUB_TOKEN (dropped after checkout by persist-credentials: false)
          # is enough to fetch this same repo — forks are skipped by the job
          # `if:`, so head repo == this repo. The push step supplies the PAT
          # for its one invocation via an inline http.extraheader instead.
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Decide the prettier config from the BASE branch alone. Never load a
      # config or plugin the PR head can influence. See the "Untrusted-head
      # hardening" block in the header.
      - name: Resolve base prettier config
        id: baseconfig
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Base commit from the event (GitHub-set, not head-controllable);
          # verified local before use. Falls back to the base ref if absent.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          config_mode="empty"
          config_file=
          prettier_spec=3
          emit() {
            {
              echo "config_mode=${config_mode}"
              echo "config_file=${config_file}"
              echo "prettier_spec=${prettier_spec}"
            } >> "$GITHUB_OUTPUT"
          }

          # Default config: an empty object materialized off-checkout. Like
          # --no-config it suppresses prettier's head-config search — no head
          # prettier.config.js / .prettierrc.cjs / package.json "prettier" ref
          # is loaded — but UNLIKE --no-config it still honors the repo's
          # .editorconfig, which keeps output byte-identical to lint.yml's
          # `prettier --check` and to prettier's pre-hardening default search.
          # (.editorconfig is data-only INI: indent/width/eol/charset; it cannot
          # execute code.) A usable BASE config replaces this file below.
          dest="${RUNNER_TEMP:-$PWD}/prettier-autofix-base-config"
          printf '%s\n' '{}' > "${dest}.empty.json"
          config_file="${dest}.empty.json"

          # Resolve the base commit. Prefer the event's base.sha (set by GitHub,
          # not the head) — after a fetch-depth:0 checkout its object is local.
          # Fall back to the base remote-tracking ref, then a shallow fetch.
          # BASE_SHA can be preset (selftest) to bypass all git plumbing.
          BASE_SHA="${BASE_SHA:-}"
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE_SHA="$(git rev-parse --verify --quiet "FETCH_HEAD^{commit}" || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::warning::prettier-autofix: could not resolve base ref '${BASE_REF}'; formatting with prettier defaults (empty config, editorconfig honored)."
            emit; exit 0
          fi

          show() { git show "${BASE_SHA}:$1" 2>/dev/null; }
          have() { git cat-file -e "${BASE_SHA}:$1" 2>/dev/null; }

          # Optional: pin prettier to whatever version the BASE declares, so
          # autofix and the base's own lint check agree. Never read the head's.
          if have package.json; then
            v="$(show package.json | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{
                const p=JSON.parse(s),d={...p.dependencies,...p.devDependencies};
                process.stdout.write(String(d.prettier||""));
              }catch(e){}})' 2>/dev/null || true)"
            case "$v" in
              ""|latest|next) : ;;
              *) if printf '%s' "$v" | grep -Eq '^[0-9A-Za-z.^~*<>=| -]+$'; then
                   prettier_spec="$v"
                 fi ;;
            esac
          fi

          # A standalone root config file wins over a package.json key.
          found=
          for name in \
            .prettierrc .prettierrc.json .prettierrc.json5 .prettierrc.yaml \
            .prettierrc.yml .prettierrc.toml .prettierrc.js .prettierrc.cjs \
            .prettierrc.mjs .prettierrc.ts .prettierrc.cts .prettierrc.mts \
            prettier.config.js prettier.config.cjs prettier.config.mjs \
            prettier.config.ts prettier.config.cts prettier.config.mts; do
            if have "$name"; then found="$name"; break; fi
          done

          if [ -n "$found" ]; then
            case "$found" in
              *.js | *.cjs | *.mjs | *.ts | *.cts | *.mts)
                echo "::warning::prettier-autofix: base prettier config '${found}' is executable (JS/TS); not loaded. Formatting with an empty config (editorconfig honored). Convert it to a data config (.prettierrc.json/.yaml/.toml) to have autofix honor it."
                emit; exit 0 ;;
              *)
                body="$(show "$found" || true)"
                if printf '%s' "$body" | grep -q 'plugins'; then
                  echo "::warning::prettier-autofix: base prettier config '${found}' declares plugins; plugin code is not loaded. Formatting with an empty config (editorconfig honored)."
                  emit; exit 0
                fi
                ext="${found##*.}"
                case "$found" in .prettierrc) ext="json" ;; esac
                config_file="${dest}.${ext}"
                printf '%s' "$body" > "$config_file"
                echo "prettier-autofix: using base config '${found}'."
                config_mode="base"
                emit; exit 0 ;;
            esac
          fi

          # Fall back to a package.json "prettier" key (object only; a string
          # is a module ref = executable, refused).
          if have package.json; then
            kind="$(show package.json | PKG_CFG_DEST="${dest}.json" node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{
                const p=JSON.parse(s);
                if(!("prettier" in p)){process.stdout.write("none");return;}
                const v=p.prettier;
                if(typeof v==="string"){process.stdout.write("string");return;}
                const j=JSON.stringify(v);
                if(/plugins/.test(j)){process.stdout.write("plugins");return;}
                require("fs").writeFileSync(process.env.PKG_CFG_DEST,j);
                process.stdout.write("object");
              }catch(e){process.stdout.write("none")}})' 2>/dev/null || echo none)"
            case "$kind" in
              object)
                config_mode="base"; config_file="${dest}.json"
                echo "prettier-autofix: using base config from package.json \"prettier\" key." ;;
              string)
                echo "::warning::prettier-autofix: base package.json \"prettier\" points to a module (executable); not loaded. Formatting with an empty config (editorconfig honored)." ;;
              plugins)
                echo "::warning::prettier-autofix: base package.json \"prettier\" declares plugins; plugin code is not loaded. Formatting with an empty config (editorconfig honored)." ;;
              *) : ;;
            esac
          fi

          emit

      # Install the prettier CLI OUTSIDE the checkout so the head's
      # package.json and .npmrc are never read: pinned registry (a head .npmrc
      # cannot redirect it), --ignore-scripts (no lifecycle code), neutralized
      # npm user-config, and the base-pinned version. No `npm ci` in the
      # checkout, and no head-controlled node_modules/.bin/prettier.
      - name: Install prettier (isolated from PR head)
        id: ptool
        env:
          PRETTIER_SPEC: ${{ steps.baseconfig.outputs.prettier_spec || '3' }}
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP:?RUNNER_TEMP is not set}/prettier-autofix-tool"
          mkdir -p "$DIR"
          # Block ~/.npmrc and the project .npmrc; the checkout is never the CWD
          # of this install, and the registry is pinned explicitly.
          export NPM_CONFIG_USERCONFIG=/dev/null
          ( cd "$RUNNER_TEMP" &&
            npm install --prefix "$DIR" --no-save --no-audit --no-fund \
              --ignore-scripts --registry=https://registry.npmjs.org/ \
              "prettier@${PRETTIER_SPEC:-3}" )
          BIN="$DIR/node_modules/.bin/prettier"
          if [ ! -x "$BIN" ]; then
            echo "::error::prettier-autofix: prettier install failed"; exit 1
          fi
          echo "prettier_bin=$BIN" >> "$GITHUB_OUTPUT"

      # Same target-resolution logic as lint.yml's "Resolve prettier targets"
      # — kept duplicated rather than factored into a composite action so
      # both workflows can evolve independently and the bash is grep-able
      # in one place per workflow. If this drifts from lint.yml, callers
      # may see autofix touching a different file set than the lint check
      # — keep them in sync when changing either.
      - name: Resolve prettier targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_ONLY: ${{ inputs.changed_only }}
          GLOB: ${{ inputs.markdown_glob || '**/*.{md,yml,yaml,json}' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(printf '%s' "$CHANGED_ONLY")" = "false" ]; then
            echo "Mode: glob (changed_only=false)"
            echo "mode=glob" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # List the PR's changed files, with retries — the API can hiccup
          # (an HTML 5xx body makes gh's --jq die with "invalid character
          # '<' looking for beginning of value"; observed on
          # whois-api-llc/wxa-secrets#27). On persistent failure SKIP this
          # run instead of falling open to the full-tree glob: a full-tree
          # pass drags in pre-existing drift from files the PR never
          # touched, and those writes can be unpushable anyway
          # (.github/workflows/** needs a workflow-scoped token that
          # automerge_pat deliberately lacks). Block below is byte-identical
          # in lint.yml — the selftest drift-checks it; keep both in sync.
          PR_FILES_LOG="$(mktemp)"
          LISTED=0
          for attempt in 1 2 3; do
            if gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                 --jq '.[] | select(.status != "removed") | .filename' \
                 > "$PR_FILES_LOG" 2>/tmp/gh_err; then
              LISTED=1
              break
            fi
            echo "Changed-file listing attempt ${attempt}/3 failed:"
            sed 's/^/  /' /tmp/gh_err || true
            if [ "$attempt" -lt 3 ]; then sleep "$(( attempt * 2 ))"; fi
          done
          if [ "$LISTED" -ne 1 ]; then
            echo "::warning::Could not list PR files after 3 attempts (transient API error, or the caller's GITHUB_TOKEN lacks 'pull-requests: read'). Skipping prettier for this run — refusing to widen scope to the full tree."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t CHANGED < "$PR_FILES_LOG"

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "PR has no added/modified/renamed files."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `compgen -G` does pathname expansion (incl. globstar `**`) but
          # NOT brace expansion. Default glob is `**/*.{md,yml,yaml,json}`,
          # so split braces into individual globs first. Mirrors lint.yml.
          shopt -s globstar nullglob
          expand_braces() {
            local pat="$1"
            if [[ "$pat" == *\{*\}* ]]; then
              local prefix="${pat%%\{*}"
              local suffix="${pat##*\}}"
              local middle="${pat#*\{}"; middle="${middle%%\}*}"
              local IFS=,
              for x in $middle; do echo "${prefix}${x}${suffix}"; done
            else
              echo "$pat"
            fi
          }
          mapfile -t SUB_GLOBS < <(expand_braces "$GLOB")
          declare -A _SEEN=()
          MATCH_GLOB=()
          for sub in "${SUB_GLOBS[@]}"; do
            mapfile -t _hits < <(compgen -G "$sub" || true)
            for h in "${_hits[@]}"; do
              if [[ -z "${_SEEN[$h]:-}" ]]; then
                _SEEN[$h]=1
                MATCH_GLOB+=("$h")
              fi
            done
          done
          if [ "${#MATCH_GLOB[@]}" -eq 0 ]; then
            echo "No files in working tree match glob '$GLOB'."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t TARGETS < <(
            comm -12 \
              <(printf '%s\n' "${CHANGED[@]}" | sort -u) \
              <(printf '%s\n' "${MATCH_GLOB[@]}" | sort -u)
          )
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "No PR-changed files match glob '$GLOB' — nothing to fix."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prettier hard-errors on explicitly specified symlinks
          # ("Explicitly specified pattern '<path>' is a symbolic link") —
          # some repos track symlinked files by convention (dotclaude's
          # skills/*/SKILL.md). Drop them: the link target gets formatted
          # whenever it appears in the diff itself. Glob mode is unaffected
          # (prettier skips symlinks it expands from a glob on its own).
          # Mirrors lint.yml — keep both filters in sync.
          SYMLINKS=()
          KEPT=()
          for f in "${TARGETS[@]}"; do
            if [ -L "$f" ]; then SYMLINKS+=("$f"); else KEPT+=("$f"); fi
          done
          if [ "${#SYMLINKS[@]}" -gt 0 ]; then
            echo "Skipping ${#SYMLINKS[@]} symlink(s) (prettier rejects explicit symlink targets):"
            printf '  %s\n' "${SYMLINKS[@]}"
          fi
          # Guarded assignment: expanding an EMPTY array under `set -u`
          # is an unbound-variable error on bash <4.4 (macOS ships 3.2 —
          # the selftest runs this block locally).
          TARGETS=()
          if [ "${#KEPT[@]}" -gt 0 ]; then TARGETS=("${KEPT[@]}"); fi
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "All PR-changed glob matches are symlinks — nothing to fix."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Mode: files (${#TARGETS[@]} target(s) after glob ∩ changed-files):"
          printf '  %s\n' "${TARGETS[@]}"
          {
            echo "mode=files"
            echo "files<<__EOF__"
            printf '%s\n' "${TARGETS[@]}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: prettier --write
        env:
          MODE: ${{ steps.targets.outputs.mode }}
          GLOB: ${{ inputs.markdown_glob || '**/*.{md,yml,yaml,json}' }}
          FILES: ${{ steps.targets.outputs.files }}
          # The base-resolved config file (base config, or an empty {}) and the
          # isolated binary from the two steps above. The head influences none.
          CONFIG_FILE: ${{ steps.baseconfig.outputs.config_file }}
          PRETTIER_BIN: ${{ steps.ptool.outputs.prettier_bin }}
        shell: bash
        run: |
          set -euo pipefail
          PRETTIER="${PRETTIER_BIN:?prettier binary not resolved}"
          # Always --config a base-resolved file (the resolve step guarantees
          # one — the base config, or an empty {}). --config suppresses
          # prettier's head-config search, so a head prettier.config.js /
          # .prettierrc.cjs / package.json "prettier" ref is never executed;
          # a base config that named a plugin was already downgraded to {}.
          # The --no-config arm is a defensive fallback only (unreached in
          # normal operation) — it too suppresses the head search.
          if [ -n "${CONFIG_FILE:-}" ]; then
            CFG=(--config "$CONFIG_FILE")
          else
            CFG=(--no-config)
          fi
          # `--` before the targets: a head file literally named `--plugin=x`
          # must be a filename, never a reparsed flag.
          case "$MODE" in
            none)
              echo "Skipping prettier — no targets in PR diff."
              ;;
            glob)
              echo "Writing glob: $GLOB"
              "$PRETTIER" "${CFG[@]}" --write -- "$GLOB"
              ;;
            files)
              # bash-3.2-safe read loop (no mapfile) so the selftest exercises
              # this on macOS too.
              cleaned=()
              while IFS= read -r f; do
                [ -n "$f" ] && cleaned+=("$f")
              done <<< "$FILES"
              echo "Writing ${#cleaned[@]} PR-changed file(s):"
              printf '  %s\n' ${cleaned[@]+"${cleaned[@]}"}
              "$PRETTIER" "${CFG[@]}" --write -- ${cleaned[@]+"${cleaned[@]}"}
              ;;
            *)
              echo "::error::Unknown prettier target mode: '$MODE'"
              exit 1
              ;;
          esac

      - name: Commit + push if changed
        env:
          # Quote the whole expression — colon-space inside the default literal
          # would otherwise be parsed as a nested YAML mapping.
          COMMIT_MESSAGE: "${{ inputs.commit_message || 'style: prettier auto-fix' }}"
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The PAT is materialized ONLY in this step, and only onto the single
          # push command's http.extraheader — never persisted to .git/config
          # (checkout ran with persist-credentials: false). Pushes via
          # GITHUB_TOKEN don't retrigger pull_request events, so the lint check
          # would stay red; the PAT push is what turns it green. See header.
          AUTOMERGE_PAT: ${{ secrets.automerge_pat }}
        # NOTE: no `set -x` anywhere in this step — the extraheader carries a
        # credential and must not be echoed to the run log.
        shell: bash
        run: |
          set -euo pipefail
          # Never ship prettier writes under .github/workflows/: pushes
          # touching workflow files need a workflow-scoped token, and
          # automerge_pat deliberately lacks that scope (fleet policy) —
          # GitHub rejects the whole push ("refusing to allow a Personal
          # Access Token to create or update workflow ... without
          # `workflow` scope"; whois-api-llc/wxa-secrets#27). Revert them:
          # workflow-file formatting belongs in a human-pushed commit.
          if ! git diff --quiet -- .github/workflows; then
            echo "::notice::Reverting prettier write(s) under .github/workflows/ — automerge_pat has no workflow scope by design. Format workflow files in a human-pushed commit."
            git diff --stat -- .github/workflows
            git checkout -- .github/workflows
          fi
          if git diff --quiet; then
            echo "::notice::No formatting changes — autofix is a no-op."
            exit 0
          fi
          echo "::notice::Prettier wrote changes — committing and pushing."
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$COMMIT_MESSAGE" \
                     -m "Auto-applied by topcoder1/ci-workflows prettier-autofix.yml. Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          if [ -z "${AUTOMERGE_PAT:-}" ]; then
            echo "::error::prettier-autofix: automerge_pat secret is empty — cannot push (a GITHUB_TOKEN push would not retrigger the lint check)."
            exit 1
          fi
          # Supply the PAT for this one push via an inline http.extraheader
          # (git does not echo `-c` values), so nothing is written to
          # .git/config where the just-run, head-controlled prettier could
          # have read it.
          AUTH_B64="$(printf 'x-access-token:%s' "$AUTOMERGE_PAT" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic ${AUTH_B64}" \
            push origin "HEAD:${HEAD_REF}"
