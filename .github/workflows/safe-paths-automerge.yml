name: Safe-paths Auto-merge (reusable)

# Auto-enables `gh pr merge --auto` on any PR whose diff touches ONLY
# explicitly-safe paths — docs and test files by default. The gate is
# all-or-nothing: if even one changed file is outside the safe list,
# this workflow no-ops and downstream workflows (Claude-author auto-
# merge, manual click) decide.
#
# The "safe" categorization assumes:
#   - docs/**: zero runtime impact, can never break code paths
#   - tests/**: failing tests can't ship; passing tests can't break runtime
#
# Caller repos opt in by installing a thin caller workflow that calls
# this reusable. Auto-merge enablement uses GitHub's native
# `gh pr merge --auto`, so branch-protection required-status-checks
# still apply — this workflow does not bypass them.
#
# Differs from claude-author-automerge.yml: that one gates on PR author
# (Claude or human via override label). This one gates on diff content
# alone — any author whose PR touches only safe paths gets auto-merge,
# because the path classification itself is the safety argument.

on:
  workflow_call:
    inputs:
      merge_method:
        description: "Merge method: merge | squash | rebase"
        required: false
        type: string
        default: "squash"
      extra_safe_globs:
        description: |
          Optional additional egrep patterns (newline-separated, one per
          line) considered safe in this caller repo. Merged with the
          built-in list; all-or-nothing rule still applies.
        required: false
        type: string
        default: ""
      risk_bypass_label:
        description: |
          Label that releases the risk-tier hold below. Must match the
          caller's claude-author-automerge `risk_bypass_label` — that
          workflow's blocked-PR comment advertises this exact label as the
          one-click bypass, so a mismatch would leave the advertised
          escape hatch dead here.
        required: false
        type: string
        default: "auto-merge-approved"
    secrets:
      automerge_pat:
        description: >-
          Fine-grained USER PAT used to enable auto-merge, so the merge
          is attributed to the PAT user. Without it, or when it is not a
          user credential (GET /user must answer type=User), this workflow
          does not arm (Dependabot PRs excepted): a GITHUB_TOKEN arm merges as
          github-actions[bot], and GitHub then skips the repo's automatic
          head-branch deletion (the merged branch survives and a later
          push to it never reaches main — wxa-graph#553) and suppresses
          every push-on-main workflow. Use a USER PAT, not an App token:
          GITHUB_TOKEN is itself an App installation token (measured), and
          other Apps' merges are reported to keep the branch too (untested
          here). Same contract as
          claude-author-automerge.yml. Required scopes - repo contents r/w,
          pull-requests r/w. Pass it EXPLICITLY; `secrets: inherit` passes
          nothing to a reusable owned by a different account.
        required: false

# Serialize per PR. Without this, a run that classified an OLDER, docs-only
# head can still be sitting in its enable step when a push adds
# docs/legal/**; it then arms auto-merge against the CURRENT head — the
# legal revision — and the newer run has already passed its revoke check, so
# no event remains to disarm it. cancel-in-progress kills the stale run; the
# head guard on the enable step below covers the window where it was already
# past cancellation. (Codex review round 8 P1.)
concurrency:
  group: safe-paths-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe_paths_automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check if every changed file is in a safe path
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXTRA_GLOBS: ${{ inputs.extra_safe_globs }}
          BYPASS_LABEL: ${{ inputs.risk_bypass_label }}
        run: |
          set -euo pipefail
          # Changed-file names via the paginated files API — `gh pr diff
          # --name-only` HTTP-406s on diffs >20k lines (dotclaude#121).
          # (Also sidesteps the old "--repo required without a local
          # checkout" footgun — the API form never needs a checkout.)
          changed=$(gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[].filename')
          # NOTE the 3000-file truncation check lives AFTER the override
          # block below, not here. Both exit early with all_safe=0, but only
          # the overrides also emit a revoke-triggering reason
          # (unsafe-override / risk-tier-hold). Returning on truncation first would
          # skip the override entirely, so an already-armed PR updated to
          # 3000+ files including docs/legal/** would keep its arm and merge
          # the legal change. (Codex review round 8 P2.) Checking the
          # override on a truncated list is strictly better than not
          # checking it: it still catches any legal path within the first
          # 3000 entries.

          # Built-in UNSAFE overrides, checked BEFORE the safe globs and
          # winning over every one of them. These are paths that sit inside
          # an otherwise-safe tree but are not "documentation" in the sense
          # the safety argument above relies on.
          #
          # docs/legal/**: customer-facing legal wording (AUP, ToS, privacy).
          # The `^docs/.*` safe glob's premise is "zero runtime impact, can
          # never break code paths" — true of a runbook, false of a document
          # that states contractual commitments to customers. A wrong clause
          # cannot be caught by CI and is not revertable in one cycle once
          # published, which is the repo protocol's own test for manual merge.
          # Lesson 2026-07-25, whois-api-llc/wxa_vpn#1268: an AUP change
          # asserting that all bulk deliveries are watermarked auto-merged
          # here in ~seconds. The assertion was false for two formats (.mmdb,
          # .parquet), and no human saw it before it landed on main.
          #
          # NOTE this is deliberately a SEPARATE gate from the customer-copy
          # policy in claude-author-automerge.yml, which is enforced via the
          # caller's .github/risk-paths.yml `sensitive:` list. That gate
          # cannot help here: this workflow never consults the classifier —
          # it decides on diff content alone — so a repo can list
          # docs/legal/** as `sensitive:` and still have it merged by this
          # workflow. Both gates are required; neither subsumes the other.
          #
          # TIER 1 — ABSOLUTE. Deliberately NOT released by the bypass
          # label: a contractual clause needs the human who merges it to
          # have read it, and a label click is not that.
          unsafe_overrides='^docs/legal/'

          # TIER 2 — RISK-TIER HOLD (lesson 2026-08-10, below).
          #
          # Why this has to live in THIS workflow: claude-author-automerge
          # cannot block a merge. It can only decline to ARM one. This
          # workflow is the only one that arms auto-merge on a docs/tests
          # diff and the only one that can revoke a standing arm — so a
          # risk-tier decline over there is a NO-OP unless it is honored
          # here. The two gates never disagreed in any resolvable sense:
          # one abstained while the other acted.
          #
          # Incident, topcoder1/inbox_superpilot#215: a tests-only PR
          # touching web/tests/e2e/auth/signup.spec.ts drew "Auto-merge
          # blocked — risk-tier paths touched. Manual click-merge required"
          # from claude-author-automerge, then merged here 12 minutes
          # later. That comment is still on the merged PR. A gate that
          # announces a block it cannot enforce is worse than no gate: it
          # leaves an audit trail asserting a human approval that never
          # happened.
          #
          # The premise the `*.spec.ts` safe glob rests on — "passing tests
          # can't break runtime" — is true about RUNTIME and false about
          # DETECTION. Deleting the assertion that catches a lockout is how
          # the lockout ships in a LATER PR, laundered through a green
          # suite. Same shape as the docs/legal case: a defect CI cannot
          # catch, and the safe-by-glob argument does not reach it.
          #
          # Released by the caller's risk_bypass_label — the same one-click
          # label claude-author-automerge's blocked-PR comment advertises.
          # Holding without honoring that label would kill the advertised
          # escape hatch.
          #
          # COPIED VERBATIM from the `patterns=` block in
          # claude-author-automerge.yml. selftest/test_safe_paths_risk_tier_hold.sh
          # re-derives both and fails on drift — edit both or neither.
          risk_tier_overrides='^(.*/)?(auth|login|signin|signup|logout|session[s]?|oauth|oauth2|sso|jwt|mfa|totp|webauthn|passkey)(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^(.*/)?secret[s]?(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^(.*/)?\.env($|\..*)
          ^(.*/)?keychain.*
          ^(.*/)?credentials.*
          ^(.*/)?migrations(/|$)
          .*\.sql$
          ^(.*/)?(billing|payment[s]?|pricing|invoice[s]?|subscription[s]?|checkout|refund[s]?)(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^docs/legal/.*
          ^docs/decisions/.*
          ^docs/(marketing|pricing|product-page)([/.-]|$)
          (^|/)naf(/|\.(py|go|ts|js)$)
          (^|/)main\.go$
          (^|/)Dockerfile(\..*)?$
          (^|/)[^/]*\.Dockerfile$
          ^docker-compose.*\.ya?ml$
          (^|/)docker/docker-compose.*\.ya?ml$
          (^|/)docker-compose[^/]*\.ya?ml$
          (^|/)compose(\.[^/]*)?\.ya?ml$
          ^\.github/workflows/.*
          ^templates/ci-workflows/.*
          ^\.github/actions?/.*
          ^\.github/scripts/.*
          (^|/)action\.ya?ml$
          ^\.github/dependabot\.ya?ml$
          ^\.github/risk-paths\.yml$
          ^(docs/)?CODEOWNERS$
          ^\.github/CODEOWNERS$
          ^infra/iam/.*
          ^infra/(deploy|terraform|pulumi|k8s|cloudformation|ansible|digitalocean|scanner-id)/.*
          ^infra/nginx.*
          ^infra/.*\.(service|slice|timer|tf|hcl|sh)$
          ^terraform/.*
          ^pulumi/.*
          ^k8s/.*
          ^fly\.toml$
          ^deploy/.*
          (^|/)deploy.*\.(sh|ya?ml)$
          (^|/)ml/predictor\.(py|go|ts|js)$
          (^|/)ml/retrain\.(py|go|ts|js)$'

          # A rename reports ONLY its destination in `.filename`; the source
          # path lives in `.previous_filename`. Without this, moving
          # docs/legal/aup.md to docs/archive/aup.md — which removes the
          # policy from its canonical location — reads as a plain docs/**
          # change and auto-merges. Match the override against BOTH ends of
          # every rename. Tier 2 and the renames_safe check below read the
          # sources too: a rename source is a path the PR removes, so moving
          # src/worker.py into docs/archive/ must not arm here. Deliberately
          # a separate request rather than folding both fields into the
          # `changed` listing above: the 3000-file cap below counts that
          # listing's entries, one per changed file, and the safe-glob loop
          # reads changed files alone so that a diff whose only unsafe path
          # is a rename source still reaches tiers 2 and 3.
          renamed_from=$(gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[] | select(.previous_filename) | .previous_filename')

          override_hits=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            while IFS= read -r p; do
              p="${p#"${p%%[![:space:]]*}"}"
              [ -z "$p" ] && continue
              if echo "$f" | grep -Eq "$p"; then
                override_hits="$override_hits$f"$'\n'
                break
              fi
            done <<< "$unsafe_overrides"
          done <<< "$(printf '%s\n%s\n' "$changed" "$renamed_from")"

          if [ -n "$override_hits" ]; then
            echo "all_safe=0" >> "$GITHUB_OUTPUT"
            echo "reason=unsafe-override" >> "$GITHUB_OUTPUT"
            echo "Not safe — diff touches a built-in unsafe-override path."
            echo "Override hits:"
            # Render with printf '%s', never %b. These lists are built from
            # PR-controlled file names and go to the step log — which the
            # runner scans for ::workflow commands:: — so %b-expanding a name's
            # backslash bytes into standalone lines is an injection surface.
            # (Same reasoning as the risk step in claude-author-automerge.yml.)
            printf '%s' "$override_hits"
            exit 0
          fi


          # Deferred from above: the listing endpoint caps at 3000 files.
          # Past that we can't prove every changed file is safe → defer
          # (same stance as the empty-diff branch below).
          if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ge 3000 ]; then
            echo "all_safe=0" >> "$GITHUB_OUTPUT"
            echo "reason=file-list-truncated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Built-in safe globs: docs and test files. Patterns are
          # POSIX-extended regex (used with `grep -E`).
          builtin_globs='^docs/.*
          ^tests/.*
          (^|/)test_[^/]+\.py$
          (^|/)[^/]+_test\.(py|go|js|ts)$
          (^|/)[^/]+\.(test|spec)\.(jsx?|tsx?)$
          (^|/)__tests__/'

          all_globs="$builtin_globs"
          if [ -n "${EXTRA_GLOBS:-}" ]; then
            all_globs="$all_globs
          $EXTRA_GLOBS"
          fi

          # An empty diff (label-only PR event, etc.) is NOT safe — we
          # don't have evidence of safety, so defer to other workflows.
          if [ -z "$(echo "$changed" | tr -d '[:space:]')" ]; then
            echo "all_safe=0" >> "$GITHUB_OUTPUT"
            echo "reason=empty-diff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Changed files only, deliberately. Rename sources are checked
          # after tier 2 (renames_safe below), not here: a diff whose only
          # unsafe path is a rename source must still reach tiers 2 and 3.
          unsafe_files=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            matched=0
            while IFS= read -r p; do
              p="${p#"${p%%[![:space:]]*}"}"
              [ -z "$p" ] && continue
              if echo "$f" | grep -Eq "$p"; then
                matched=1
                break
              fi
            done <<< "$all_globs"
            if [ "$matched" -eq 0 ]; then
              unsafe_files="$unsafe_files$f"$'\n'
            fi
          done <<< "$changed"

          if [ -n "$unsafe_files" ]; then
            echo "all_safe=0" >> "$GITHUB_OUTPUT"
            # The list of unsafe files is only ever logged, never read by a
            # later step (no `outputs.unsafe` reference exists, and this
            # reusable declares no job/workflow_call outputs). It is built
            # from PR-controlled file names, so it must not be written to
            # $GITHUB_OUTPUT: the decision (all_safe) is the only thing the
            # rest of the job needs, and it is a function of classification
            # alone. Keep the human-readable list on the step log only.
            echo "Not all safe — deferring to other automerge workflows."
            echo "Unsafe files:"
            printf '%s' "$unsafe_files"
          else
            # TIER 2 — RISK-TIER HOLD. Evaluated ONLY here, in the branch
            # where every changed file is safe-by-glob and this workflow
            # would otherwise arm. Placing it earlier (beside the tier-1
            # override) looked equivalent and is not: it would emit a
            # revoke-triggering reason on PRs this workflow never arms — a
            # dependabot bump of `.github/workflows/**` matches the risk
            # patterns — and the revoke step would then disarm a SIBLING
            # workflow's legitimate auto-merge. Scoping the hold to the
            # would-arm branch keeps the blast radius exactly the target
            # set: diffs that are 100% docs/tests AND touch a risk path.
            #
            # Scans `renamed_from` too, so moving an auth spec OUT of
            # auth/ (destination safe-by-glob, source risk-tier) still
            # holds — same rename-bypass reasoning as tier 1.
            #
            # One `grep -E -f` pass rather than the nested per-pattern loop
            # used above: tier 1 is a single pattern, tier 2 is the whole
            # risk-tier list, and at the 3000-file cap the nested form would
            # fork over 100k greps.
            # Matching FILES is all the decision needs; the per-pattern
            # attribution below runs only over the (few) hits, so the log
            # stays as actionable as the sibling's blocked-PR comment.
            risk_pat_file=$(mktemp)
            printf '%s\n' "$risk_tier_overrides" \
              | sed -e 's/^[[:space:]]*//' -e '/^$/d' > "$risk_pat_file"
            risk_hits=$(printf '%s\n%s\n' "$changed" "$renamed_from" \
              | sed '/^$/d' | grep -E -f "$risk_pat_file" || true)
            rm -f "$risk_pat_file"

            if [ -n "$risk_hits" ]; then
              annotated=""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                while IFS= read -r p; do
                  p="${p#"${p%%[![:space:]]*}"}"
                  [ -z "$p" ] && continue
                  if echo "$f" | grep -Eq "$p"; then
                    annotated="$annotated$f (matched: $p)"$'\n'
                    break
                  fi
                done <<< "$risk_tier_overrides"
              done <<< "$risk_hits"

              # Read labels LIVE, not from the event payload: the bypass is
              # applied by a human AFTER the blocked-PR comment appears, so
              # a payload captured at `opened`/`synchronize` never shows it.
              # Fail CLOSED — an unreadable label list holds the PR, which
              # matches this workflow's stance everywhere else.
              bypass_label="${BYPASS_LABEL:-auto-merge-approved}"
              pr_labels=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.labels[].name' 2>/dev/null || echo "")
              if printf '%s\n' "$pr_labels" | grep -Fxq "$bypass_label"; then
                echo "::notice::Risk-tier paths present but '$bypass_label' is applied — hold released."
                printf '%s' "$annotated"
              else
                echo "all_safe=0" >> "$GITHUB_OUTPUT"
                echo "reason=risk-tier-hold" >> "$GITHUB_OUTPUT"
                echo "::warning::Diff is docs/tests-only but touches risk-tier paths — holding for a human. Apply '$bypass_label' to release."
                echo "Risk-tier hits:"
                printf '%s' "$annotated"
                exit 0
              fi
            fi

            # renames_safe: every rename's OLD path must be safe-by-glob too
            # before this workflow arms (the enable step requires '1'). A
            # rename source is a path the PR removes; the same change listed
            # as a removal plus an addition fails the loop above. Checked
            # here, after tier 2, so a risk-tier or caller-gated source still
            # yields the tier-2/tier-3 hold the revoke step acts on.
            # renames_safe=0 itself is a defer verdict, like the loop's: it
            # withholds this workflow's arm and revokes nothing, because a
            # sibling may legitimately arm the same diff (claude-author-
            # automerge arms a `standard` move of src/ into docs/).
            unsafe_sources=""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              matched=0
              while IFS= read -r p; do
                p="${p#"${p%%[![:space:]]*}"}"
                [ -z "$p" ] && continue
                if echo "$f" | grep -Eq "$p"; then
                  matched=1
                  break
                fi
              done <<< "$all_globs"
              if [ "$matched" -eq 0 ]; then
                unsafe_sources="$unsafe_sources$f"$'\n'
              fi
            done <<< "$renamed_from"
            if [ -n "$unsafe_sources" ]; then
              echo "renames_safe=0" >> "$GITHUB_OUTPUT"
              echo "Not arming — a renamed file's old path is outside the safe paths:"
              printf '%s' "$unsafe_sources"
            else
              echo "renames_safe=1" >> "$GITHUB_OUTPUT"
            fi

            echo "all_safe=1" >> "$GITHUB_OUTPUT"
            echo "All $(echo "$changed" | wc -l | tr -d ' ') changed files are in safe paths."
          fi

      # TIER 3 — THE CALLER'S OWN POLICY.
      #
      # Tiers 1 and 2 above are FLEET-WIDE lists: every repo gets the same
      # unsafe overrides and the same risk-tier regex. Neither has ever read
      # the caller's `.github/risk-paths.yml`, so a path a repo declared
      # `sensitive:`/`blocked:` in its OWN policy was armed here regardless —
      # and claude-author-automerge.yml declining to arm it does not stop
      # that, because a decline is an ABSTENTION, not a veto: this workflow
      # is the only one that arms a docs/tests diff, so the permissive gate
      # wins silently (inbox_superpilot#215, 2026-08-10).
      #
      # The fleet has been patching this one pattern at a time — docs/legal,
      # docs/decisions, docs/marketing, docs/pricing, docs/product-page all
      # entered the central lists because some repo's own `sensitive:` entry
      # could not reach this workflow. That does not scale and it over-blocks
      # 141 repos to gate one. Read the caller's policy instead.
      #
      # Scoped to the would-arm branch, for the same reason tier 2 is: a
      # verdict emitted on a PR this workflow never arms would make the
      # revoke step disarm a SIBLING workflow's legitimate auto-merge.
      # That scoping is also what keeps the cost off the common path —
      # nothing here runs unless the diff is already 100% docs/tests and
      # clean under both fleet-wide tiers.
      #
      # NOT releasable by the bypass label, deliberately, and this is the
      # one place tier 3 differs from tier 2. It mirrors the sibling gate,
      # where a `blocked`/`sensitive` classifier verdict skips the bypass
      # step entirely: the fleet lists are our guess about a repo, but
      # risk-paths.yml is that repo's own stated policy, and a label click
      # is not an amendment to it. The escape hatch is editing the policy
      # file — visible, reviewed, and the same one the sibling offers.
      - name: Setup Node (caller risk-paths classification)
        id: setup_node
        if: steps.classify.outputs.all_safe == '1'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the caller's risk-paths.yml verdict
        id: classifier_hold
        if: steps.classify.outputs.all_safe == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          retry() { local i out; for i in 1 2 3; do if out=$("$@"); then printf '%s' "$out"; return 0; fi; [ "$i" -lt 3 ] && sleep $((i * 5)); done; return 1; }

          # Fail-closed WITHOUT exiting nonzero. Every other branch of this
          # workflow exits 0 with a reason, and that is load-bearing here: a
          # nonzero exit fails the job, which SKIPS the revoke step below and
          # leaves an arm a previous run placed standing — the opposite of
          # fail closed for the PR that most needs it. Emitting hold=1 both
          # withholds the arm and triggers the revoke. The ::error:: keeps it
          # visible in the run's annotations.
          hold() {
            echo "hold=1" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            shift
            echo "::error::$*"
            exit 0
          }

          rules_ref="$BASE_REF"

          # Rules file for a given ref. A 404 is definitive (file absent at
          # that ref); anything else retries, then holds — never arm under an
          # unreadable policy. Sets rp_state=present|absent and rp_b64.
          # Read from the BASE ref, never the head: a PR must not be able to
          # edit its own risk file to escape the gate.
          rp_state=""
          rp_b64=""
          read_rules() {
            local ref="$1" i rp_err
            rp_state=""
            for i in 1 2 3; do
              rp_err=$(mktemp)
              if rp_b64=$(gh api -X GET \
                    "repos/${REPO}/contents/.github/risk-paths.yml" \
                    -f ref="$ref" --jq '.content' 2>"$rp_err"); then
                rp_state="present"; rm -f "$rp_err"; return 0
              fi
              if grep -q 'HTTP 404' "$rp_err"; then
                rp_state="absent"; rm -f "$rp_err"; return 0
              fi
              cat "$rp_err" >&2; rm -f "$rp_err"
              [ "$i" -lt 3 ] && sleep $((i * 5))
            done
            hold "rules-unreadable" \
              "could not read .github/risk-paths.yml@${ref} after 3 attempts — refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
          }

          read_rules "$rules_ref"
          # Absent on the base ref ⇒ fall back to the DEFAULT branch's policy,
          # matching the sibling gate: a PR targeting a release/legacy branch
          # created before risk-paths.yml existed must not dodge the repo's
          # policy. Only when the default branch lacks it too is the repo
          # genuinely policy-free — which is the majority of the fleet, and
          # costs exactly one 404 to establish.
          if [ "$rp_state" = "absent" ] && [ -n "$DEFAULT_BRANCH" ] && [ "$rules_ref" != "$DEFAULT_BRANCH" ]; then
            echo "No .github/risk-paths.yml on ${rules_ref} — falling back to the default branch's policy (${DEFAULT_BRANCH})."
            rules_ref="$DEFAULT_BRANCH"
            read_rules "$rules_ref"
          fi

          if [ "$rp_state" != "present" ]; then
            echo "hold=0" >> "$GITHUB_OUTPUT"
            echo "No .github/risk-paths.yml on ${BASE_REF} or the default branch — no caller policy to honor; tiers 1 and 2 already passed."
            exit 0
          fi

          changed=$(retry gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[].filename') || \
            hold "file-list-unreadable" \
              "could not list PR changed files after 3 attempts — refusing to arm auto-merge (fail closed)."
          if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ge 3000 ]; then
            hold "file-list-truncated" \
              "PR changes 3000+ files — file listing is truncated, cannot classify against the caller's policy. Merge manually."
          fi

          # Rename SOURCES, appended AFTER the count so they can never push a
          # large-but-listable PR over the cap. A rename reports only its
          # destination in `.filename`, so without this a `sensitive:` file
          # moved into docs/** is judged solely on its new, safe-by-glob path
          # — and this workflow is the one that would arm it. Same one-way
          # argument as tiers 1 and 2: classify.mjs returns the
          # highest-priority class across the set, so adding paths can only
          # move the verdict toward gating.
          renamed_from=$(retry gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[] | select(.previous_filename) | .previous_filename') || \
            hold "file-list-unreadable" \
              "could not list PR rename sources after 3 attempts — refusing to arm auto-merge (fail closed)."
          if [ -n "$renamed_from" ]; then
            changed=$(printf '%s\n%s' "$changed" "$renamed_from")
          fi

          # The SAME classifier pr-classify.yml and claude-author-automerge.yml
          # run, fetched from the same place, run in a scratch dir so the PR
          # checkout's own (head) risk-paths.yml is never consulted. One
          # matcher across all three lanes, zero glob-semantics drift.
          work=$(mktemp -d)
          mkdir -p "$work/repo/.github"
          printf '%s' "$rp_b64" | base64 -d > "$work/repo/.github/risk-paths.yml"
          fetch_mjs() {
            gh api "repos/topcoder1/ci-workflows/contents/.github/scripts/$1" \
              --jq '.content'
          }
          for s in classify.mjs classifier-deps.mjs; do
            retry fetch_mjs "$s" | base64 -d > "$work/$s" || true
            if [ ! -s "$work/$s" ]; then
              hold "classifier-unreadable" \
                "fetched an empty $s from topcoder1/ci-workflows — refusing to arm auto-merge (fail closed)."
            fi
          done

          # classify.mjs exits nonzero on its own fail-closed guards (bracket,
          # negation, scalar-where-a-list-belongs, YAML parse). `set -e` would
          # kill the step and skip the revoke, so capture the status and hold.
          # stderr goes to its own file, NOT into `class`: classify.mjs writes
          # a non-fatal warning there on the node_modules fallback path, and
          # folding that into stdout would turn a perfectly good verdict into
          # an enum violation.
          class=""
          cls_err=$(mktemp)
          if ! class=$(cd "$work/repo" && printf '%s\n' "$changed" | node "$work/classify.mjs" 2>"$cls_err"); then
            hold "classifier-error" \
              "classify.mjs failed against .github/risk-paths.yml@${rules_ref} — refusing to arm auto-merge (fail closed). Output: $(tr '\n' ' ' < "$cls_err")"
          fi
          rm -f "$cls_err"
          class=$(printf '%s' "$class" | tr -d '[:space:]')
          echo "risk-paths.yml@${rules_ref} verdict: $class"

          # Closed enum: anything outside the classifier's documented classes
          # (a garbled line, an empty string, a future class this workflow
          # doesn't know) must hold, not fall through as benign.
          case "$class" in
            blocked|sensitive)
              echo "hold=1" >> "$GITHUB_OUTPUT"
              echo "reason=classifier-hold" >> "$GITHUB_OUTPUT"
              echo "::warning::Diff is docs/tests-only but the caller's own .github/risk-paths.yml@${rules_ref} classifies it '${class}' — holding for a human. The bypass label does not release a caller-policy verdict; amend risk-paths.yml if the path should not be gated."
              ;;
            standard|safe_test|safe_deps|safe_config|trivial)
              echo "hold=0" >> "$GITHUB_OUTPUT"
              ;;
            *)
              hold "classifier-enum" \
                "classify.mjs printed unexpected class '$class' — refusing to arm auto-merge (fail closed)."
              ;;
          esac

      # Computing all_safe=0 is not enough once auto-merge is already ON.
      # GitHub PRESERVES an auto-merge request across pushes, so the
      # sequence "PR touches only docs/foo.md (armed here) → push adds
      # docs/legal/aup.md" leaves the arm standing: this run recomputes
      # all_safe=0, exits, and the legal change merges the moment required
      # checks go green. That is the very bypass the override exists to
      # stop. Revoke explicitly. (Codex review round 5.)
      #
      # ONLY for the override — not for every all_safe=0. The other
      # not-safe branches mean "defer to another workflow", and those
      # workflows legitimately arm auto-merge; revoking there would fight
      # them. The override is the one branch that is a positive "this must
      # not auto-merge" verdict.
      # `file-list-truncated` is included because a legal path can hide past
      # the API's 3000-entry cap: the override scan then sees no hit, yet we
      # also cannot prove the revision is clean. An arm from an earlier safe
      # revision must not survive that. Consistent with the sibling gate —
      # claude-author-automerge.yml also fails closed on truncation — so this
      # does not fight a workflow that would legitimately arm.
      # (Codex review round 10 P2.)
      # `risk-tier-hold` joins the revoke set for the same reason as the
      # override: GitHub PRESERVES an auto-merge request across pushes, so
      # "PR touches only kb/*.spec.ts (armed here) → push adds
      # auth/signup.spec.ts" would otherwise keep the arm and merge the
      # auth-test change the hold exists to stop. Both are positive "this
      # must not auto-merge" verdicts, unlike the other all_safe=0 branches
      # which mean "defer to another workflow". Releasing the hold via the
      # bypass label sets no reason at all, so an operator who applies the
      # label never trips this step. (Lesson 2026-08-10, inbox_superpilot#215.)
      # `classifier_hold` joins the revoke set for exactly the reason the two
      # above it did: GitHub PRESERVES an auto-merge request across pushes,
      # so "PR touches only docs/notes.md (armed here) → push adds a path the
      # caller's risk-paths.yml gates" would otherwise keep the arm. Every
      # hold=1 it emits is a positive "this must not auto-merge" verdict —
      # both the classified blocked/sensitive case and its fail-closed
      # branches, which is why that step holds rather than exiting nonzero
      # (a failed step would SKIP this revoke and leave the arm standing).
      #
      # The last clause is the ERROR path, and it needs `always()`: the
      # tier-3 step converts every failure mode it ANTICIPATES into hold=1,
      # but `setup_node` failing (a node download blip) or an unanticipated
      # error inside the step itself leaves no output at all. Both skip this
      # step under its implicit success(), so an arm an earlier revision
      # placed survives and merges once required checks go green — exactly
      # the bypass the tier exists to stop (codex round 1 P1).
      #
      # Scoped to `all_safe == '1'`, which is what keeps it from fighting a
      # sibling: in that branch every changed file is safe-by-glob, so this
      # workflow is the one that arms. The exception is renames_safe == '0'
      # (a rename's old path is not safe-by-glob): the arm is withheld there
      # and a sibling may hold a legitimate one, yet a tier-3 error still
      # revokes, failing closed as on main, where such a diff read
      # all_safe=1 and armed here. A hard failure of the
      # `classify` step itself is deliberately NOT covered — all_safe is
      # then unknown, the diff may carry source files, and revoking would
      # disarm a sibling's legitimate arm on a PR this workflow never had a
      # view on. Every new disjunct demands an explicit `== 'failure'`, so a
      # cancelled run (concurrency cancel-in-progress is on) never trips it,
      # and the head-ownership guard below still covers a moved head.
      - name: Revoke auto-merge on a must-not-merge verdict or gate error
        if: |
          always() &&
          (steps.classify.outputs.reason == 'unsafe-override' ||
           steps.classify.outputs.reason == 'risk-tier-hold' ||
           steps.classify.outputs.reason == 'file-list-truncated' ||
           steps.classifier_hold.outputs.hold == '1' ||
           (steps.classify.outputs.all_safe == '1' &&
            (steps.setup_node.outcome == 'failure' ||
             steps.classifier_hold.outcome == 'failure')))
        env:
          # Match the enable step's token: an arm placed by the PAT is
          # revoked by the same identity.
          GH_TOKEN: ${{ secrets.automerge_pat || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 'gate-error' is the third case: the error path below runs with
          # neither step having emitted a reason, and "unknown" in the log
          # would read as a bug rather than the specific condition it is.
          CLASSIFY_REASON: ${{ steps.classify.outputs.reason || steps.classifier_hold.outputs.reason || 'gate-error' }}
        run: |
          set -euo pipefail
          # Ownership guard, mirroring claude-author-automerge.yml: if the
          # head moved since this run's event, the newer head's own run
          # owns the decision and an unconditional revoke here could land
          # after it validly armed a clean PR, with no event left to
          # re-arm. Skip only on a POSITIVE head-moved read; if the read
          # itself fails, revoke anyway (fail toward safety).
          now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || echo "")
          if [ -n "$now" ] && [ "$now" != "$HEAD_SHA" ]; then
            echo "::notice::head moved (${HEAD_SHA} → ${now}) — newer run owns gating; skipping stale revoke."
            exit 0
          fi
          state=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
          if [ "$state" = "OFF" ]; then
            echo "Auto-merge already off — nothing to revoke."
            exit 0
          fi
          echo "::warning::Diff touches a path this workflow must not auto-merge (reason=${CLASSIFY_REASON:-unknown}) while auto-merge is armed — revoking."
          # Fail CLOSED: only a verified OFF is success. A swallowed
          # `--disable-auto` failure or an unreadable verify both leave the
          # PR possibly still armed, and treating that as success would let
          # the legal change merge — exactly what this step exists to stop.
          # UNKNOWN is not OFF. (Codex review round 6.)
          after="UNKNOWN"
          for attempt in 1 2 3; do
            gh pr merge --disable-auto "$PR_URL" 2>&1 || true
            after=$(gh pr view "$PR_URL" --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
            echo "Revoke attempt ${attempt}: auto-merge state = $after"
            [ "$after" = "OFF" ] && break
            sleep 3
          done
          if [ "$after" != "OFF" ]; then
            echo "::error::could not VERIFY auto-merge is off (state=$after) after 3 attempts — a customer-facing legal change may merge unreviewed. Disable auto-merge on this PR by hand."
            exit 1
          fi
          echo "Auto-merge verified OFF."

      # `hold == '0'`, not `hold != '1'`. Arm only on POSITIVE evidence that
      # the classifier ran and cleared the diff: a skipped or hard-failed
      # step leaves the output an empty string, which `!= '1'` reads as
      # permission to arm. Every path through that step writes hold
      # explicitly, so requiring '0' costs nothing and is the only form that
      # stays fail-closed if the step ever stops running. `renames_safe ==
      # '1'` on the same terms: every rename's old path must be safe-by-glob
      # as well (see the classify step), and a missing output does not arm.
      - name: Enable auto-merge
        if: >-
          steps.classify.outputs.all_safe == '1' &&
          steps.classify.outputs.renames_safe == '1' &&
          steps.classifier_hold.outputs.hold == '0'
        env:
          # The caller's PAT, so the merge is user-attributed: GitHub then
          # deletes the head branch and push-on-main workflows run. The
          # github.token fallback only serves the head read and a Dependabot
          # PR's arm; the attribution gate in the script refuses every other
          # arm without the PAT. See the `automerge_pat` secret docstring.
          GH_TOKEN: ${{ secrets.automerge_pat || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METHOD: ${{ inputs.merge_method }}
          USING_PAT: ${{ secrets.automerge_pat != '' && '1' || '0' }}
          # The PR's author login — the one field no PR contents can set, so
          # only Dependabot's own PRs can take the exception below.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Attribution gate (2026-09-18) — the same gate, for the same
          # measured reason, as the arm step in claude-author-automerge.yml:
          # after a GITHUB_TOKEN arm GitHub merges as github-actions[bot],
          # skips the automatic head-branch deletion, and a later push to
          # the surviving branch never reaches main. Declines to arm (exit
          # 0; a user's arm — a human's or a PAT-wired sibling's — is never
          # revoked, and a bot's arm is removed below). Not a failing
          # step: this check must never block a click-merge, and a red run
          # here would carry no more information than the annotation.
          # Dependabot's own PRs keep the old behavior — their runs never
          # receive Actions secrets, and Dependabot deletes its branch after
          # the merge (wxa-mcp-server's docs/package.json bumps take this
          # path). A present secret must also BE a user credential: an App
          # installation token arms as its bot, and GET /user answers only
          # for a user (installation tokens get a 403).
          refuse_unattributed_arm() {
            msg="$1 Arming here would make GitHub merge this PR as a bot, which skips the automatic head-branch deletion (a later push to the surviving branch never reaches main) and silences push-on-main workflows. Not arming. Fix the caller: pass the repo's AUTOMERGE_PAT secret — a USER PAT — explicitly as automerge_pat; secrets: inherit passes nothing to a reusable owned by another account. Or click-merge."
            echo "::error::$msg"
            echo "$msg" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          }
          # Disable auto-merge and VERIFY it is off, 3 attempts — the same
          # shape as the revoke step above. Nothing after this step retries a
          # failed disable, so a single attempt is not fail-closed.
          remove_arm() {
            local after="UNKNOWN"
            for _ in 1 2 3; do
              gh pr merge --disable-auto "$PR_URL" 2>&1 || true
              after=$(gh pr view "$PR_URL" --json autoMergeRequest \
                --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
              [ "$after" = "OFF" ] && return 0
              sleep 3
            done
            echo "::error::could not verify the bot's arm is off (state '$after' after 3 attempts) — failing closed."
            return 1
          }
          # The GET /user probe runs FIRST, before the head read below (Codex
          # round 3): its retries and backoff take seconds, and that time must
          # not sit between the head read and the arm. Only the answer is
          # recorded here; the decision comes after the head read.
          arm_as=""
          if [ "$PR_AUTHOR" != "dependabot[bot]" ] && [ "$USING_PAT" = "1" ]; then
            for _ in 1 2 3; do
              if arm_as=$(gh api user --jq 'select(.type == "User") | .login' 2>/dev/null); then
                break
              fi
              arm_as=""
              sleep 2
            done
          fi
          # A BOT's arm already on a non-Dependabot PR merges as that bot
          # whatever this run does (re-arming keeps the original enabler —
          # measured), so remove it and let the arm below or the refusal take
          # over (Codex round 5). A user's arm is never touched; an unreadable
          # arm state leaves things as they are. Done before the head read so
          # it adds no time between that read and the arm. Residual race,
          # accepted (Codex round 6): a user arm placed between the read and
          # the disable is revoked too (GitHub's disable takes no expected
          # enabler); the cost is a PR left unarmed until its next event or a
          # click, against a bot-attributed merge that strands later pushes.
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            armed_by=$(gh pr view "$PR_URL" --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "none" elif (.autoMergeRequest.enabledBy.is_bot // false) then "bot" else "user" end' \
              2>/dev/null) || armed_by="unknown"
            if [ "$armed_by" = "bot" ]; then
              echo "::notice::a bot armed this PR — its merge would skip the head-branch deletion, so removing that arm."
              remove_arm || exit 1
            fi
          fi
          # Arm only the head this run actually classified. `gh pr merge
          # --auto` acts on the PR's CURRENT head, so a run that classified
          # an older docs-only revision would otherwise arm a newer revision
          # it never inspected — including one that added docs/legal/**.
          # Fail CLOSED on an unreadable head: skipping an arm is harmless
          # (the newer head's own run arms it), arming blind is not.
          # (Codex review round 8 P1.)
          now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || echo "")
          if [ "$now" != "$HEAD_SHA" ]; then
            echo "::notice::head is '${now:-<unreadable>}' but this run classified '${HEAD_SHA}' — not arming; the current head's own run owns that decision."
            exit 0
          fi
          # The attribution decision — no network call before the arm.
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            if [ "$USING_PAT" != "1" ]; then
              refuse_unattributed_arm "No automerge_pat reached this workflow."
            fi
            if [ -z "$arm_as" ]; then
              refuse_unattributed_arm "automerge_pat is not a user credential (GET /user did not return a User after 3 attempts)."
            fi
            echo "Arming as $arm_as (user credential)."
          fi
          echo "Safe-paths-only diff — enabling auto-merge ($METHOD)."
          if [ "$USING_PAT" = "1" ]; then
            echo "Auth: caller-supplied automerge_pat — the merge is attributed to the PAT user, so GitHub deletes the head branch and push-on-main workflows run."
          else
            echo "::notice::Auth: GITHUB_TOKEN for a Dependabot PR — Dependabot-triggered runs never receive Actions secrets, and Dependabot deletes its own branch after the merge."
          fi
          # Bound to the classified head (Codex round 3): --match-head-commit
          # makes GitHub reject the arm atomically if the head moved after the
          # read above, closing that window instead of only narrowing it —
          # the same binding claude-author-automerge.yml uses.
          if ! gh pr merge --auto --"$METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || echo "")
            if [ -n "$now" ] && [ "$now" != "$HEAD_SHA" ]; then
              echo "::notice::head moved (${HEAD_SHA} → ${now}) between the head read and the arm — not arming; the newer head's own run owns that decision."
              exit 0
            fi
            echo "::error::enable auto-merge failed and the head still matches ${HEAD_SHA} — investigate."
            exit 1
          fi
          # Read the enabler back: re-arming an already-armed PR keeps the
          # ORIGINAL enabler, so an unreadable bot-arm read above (or a bot
          # arming in between) would still leave a bot's arm. Remove it and
          # fail closed; an answer unreadable after 3 attempts fails closed
          # too. "none" is an immediate merge made with the user's
          # credential. Dependabot's own arm is a bot's by design.
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            post=""
            for _ in 1 2 3; do
              if post=$(gh pr view "$PR_URL" --json autoMergeRequest \
                --jq 'if .autoMergeRequest == null then "none" elif (.autoMergeRequest.enabledBy.is_bot // false) then "bot" else "user" end' \
                2>/dev/null); then
                break
              fi
              post=""
              sleep 2
            done
            if [ "$post" = "bot" ] || [ -z "$post" ]; then
              echo "::error::after arming, auto-merge is enabled by '${post:-<unreadable>}' rather than the PAT user — the PR would merge as a bot. Removing the arm; failing closed."
              remove_arm || true
              exit 1
            fi
          fi
