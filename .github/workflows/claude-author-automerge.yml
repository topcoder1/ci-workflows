name: Claude-author Auto-merge (reusable)

# Auto-enables `gh pr merge --auto --squash` on PRs authored by Claude
# (detected via branch prefix `claude/*`, `Co-Authored-By: Claude` trailer in
# any PR commit, or the `auto-merge` label), provided the PR is neither:
#
#  1. Classified `blocked` OR `sensitive` by the caller's .github/risk-paths.yml
#     (the `blocked:` / `sensitive:` lists — covers any repo-specific path
#     without us having to keep a parallel regex). This verdict is computed BY
#     THIS WORKFLOW at decision time: it runs the same classify.mjs that
#     pr-classify.yml runs, against the rules file read from the PR's BASE
#     branch (falling back to the default branch's file when the base ref
#     predates it). The pr-classify `risk:*` label is still honored as a
#     belt-and-suspenders second signal (covers hand-applied labels), but it
#     is no longer the only carrier — pr-classify labels via GITHUB_TOKEN,
#     whose events never trigger workflows, so label-only gating was a TOCTOU
#     race (see the classifier-verdict step below). Both classes mean manual
#     click-merge: `blocked` is a hard privilege-escalation block, `sensitive`
#     is a high-impact path the caller flags for human review (agent runtime,
#     schema, migrations, etc.) — the reusable's global risk-tier regex
#     (item 2) does NOT know a caller's repo-specific `sensitive:` paths, so
#     the direct risk-paths read is the only way these get gated. `sensitive`
#     is a no-op for callers without a `sensitive:` list.
#
#  2. Touching any risk-tier path category from the global CLAUDE.md policy:
#     - auth / login / signin / signup / logout / session(s) / oauth /
#       oauth2 / sso / jwt / mfa / totp / webauthn / passkey
#     - secret(s) / env files / keychain / credentials
#     - DB migrations / SQL files
#     - billing / payment / pricing / invoice / subscription(s) /
#       checkout / refund(s)
#     - NAF credit/billing gate code (naf.py / naf/ module at any depth —
#       the validate_call/log_successful_call client that decides whether a
#       customer API call is authorized and charged. Lesson 2026-05-28 from
#       whois-api-llc/wxa_webcat#438: a fix to src/webcat/api/middleware/naf.py
#       auto-merged because the path has no auth/billing keyword even though
#       the file IS the billing gate. Matched specifically, not via a broad
#       `middleware/` rule, to avoid over-blocking benign middleware.)
#     - Go service entrypoints (main.go at any depth — wires routes,
#       middleware, secrets loading, DB init; touching it can change
#       auth or transport behavior. Lesson 2026-05-24 from
#       whois-api-llc/wxa-mcp-server#193 + #197 where Claude PRs
#       modifying main.go + internal/oauth2/ auto-merged because the
#       `oauth` alternation didn't catch `oauth2` and main.go had no
#       pattern at all.) OPT-OUT: Go monorepos with many cmd/*/main.go
#       dev tools (not deployed services) can set `risk_main_go: false`
#       — the bare main.go pattern can't tell cmd/<service>/main.go from
#       cmd/<tool>/main.go, so it false-flags every tool. Such callers
#       gate their real deployed entrypoint via .github/risk-paths.yml.
#     - production infra: Dockerfile, docker-compose, .github/workflows,
#       .github/action(s)/ (repo-local composite actions, singular or plural —
#       executed CI code), .github/scripts/ (workflow-invoked scripts — executed
#       CI code), any action.yml|action.yaml at ANY depth (GitHub's reserved
#       action-definition filename, gated by filename like Dockerfile/main.go so
#       actions outside .github/action(s)/ are still caught),
#       .github/dependabot.yml|yaml (dependency-automation config — controls
#       what gets auto-merged and can set insecure-external-code-execution),
#       .github/risk-paths.yml, .github/CODEOWNERS, infra/iam/, infra
#       subdirs (deploy/terraform/pulumi/k8s/cloudformation/ansible/
#       digitalocean/scanner-id/nginx), systemd units + Terraform files
#       anywhere under infra/, top-level terraform/, pulumi/, k8s/,
#       fly.toml, deploy/, deploy*.{sh,yaml}. The non-workflow .github/
#       surfaces are ENUMERATED, not a blanket .github/** — README-ish
#       files (ISSUE_TEMPLATE/, PULL_REQUEST_TEMPLATE.md, FUNDING.yml,
#       actionlint.yml) stay auto-mergeable. Lesson 2026-07-10: six Claude
#       PRs whose only change was .github/dependabot.yml auto-merged because
#       the .github/ globs covered workflows/ but not the sibling
#       automation-config and composite-action/script surfaces.
#     - ML serving/model-promotion: ml/predictor.py (live scoring path),
#       ml/retrain.py (model-promotion gate). Lesson 2026-06-02: a serving-path
#       fix auto-merged because ml/ had no risk glob; now explicitly matched.
#
#       Specifically NOT risky under infra/: cron schedule files
#       (infra/crontabs/*.crontab), runbook .md files, example configs.
#       The earlier broad `^infra/.*` rule over-classified cron-only
#       changes (lesson 2026-05-04, wxa_vpn#250) and was narrowed
#       2026-05-20.
#
# Customer-copy diffs (legal / marketing / pricing wording) are MOSTLY not
# detected by the global regex here — repo layouts differ (techrecon:
# site/src/**; wxa-astro: src/content/** Tina JSON), so a central glob
# would over-block some repos and miss others. The enforcement for this
# policy category is the caller's .github/risk-paths.yml `sensitive:`
# list (item 1 above): marketing-site repos MUST list their
# wording-bearing trees there. That requirement is NOT relaxed by any of
# the exceptions below — they are a floor for the conventional docs/
# layout, never a substitute for a repo listing where its own copy lives.
#
# The exceptions all share one admission test: a FIXED CONVENTIONAL PATH
# under docs/, which cannot over-block (a repo without that directory is
# unaffected) and which therefore earns a DURABLE central gate instead of
# a per-repo one. A layout that is not conventional stays caller-side.
#
# EXCEPTION: `^docs/legal/.*` IS matched centrally (added 2026-07-27).
# Unlike a marketing tree, docs/legal/ is a fixed conventional path, so it
# cannot over-block — a repo without that directory is unaffected — and it
# needs a DURABLE gate rather than a per-repo one. safe-paths-automerge.yml
# also refuses these paths, but that is a revocation after the fact and
# races this workflow's arm; matching here means a Claude-authored legal
# change is never armed in the first place. Lesson 2026-07-25,
# whois-api-llc/wxa_vpn#1268: an AUP change asserting all bulk deliveries
# are watermarked (false for .mmdb and .parquet) auto-merged unreviewed.
# Legal wording is the archetypal not-revertable-in-one-cycle category:
# CI cannot check whether a clause is TRUE. Lesson 2026-07-02 from
# whois-api-llc/techrecon#405: a marketing-copy PR auto-merge-armed
# because techrecon's sensitive: list had no site/ entries; fixed in
# techrecon#410 + wxa-astro#63. Claude Review still reviews copy
# semantically, but it is not the merge gate for this category.
#
# SECOND EXCEPTION, same shape: `^docs/decisions/.*` (added 2026-08-27).
# Decision records (ADRs) live at a fixed conventional path, and repo
# contracts require explicit human approval to amend them (wxa-graph
# AGENTS.md: "existing ADRs are amended only with explicit human
# approval") — yet docs/** is trivial/safe-by-glob in every automerge
# lane, so a docs-only ADR amendment auto-merged with no click
# (verified 2026-08-27, whois-api-llc/wxa-graph#477 — that PR carries
# the repo-side sensitive: + CODEOWNERS fix; this pattern is the durable
# central gate, and the safe-paths tier-2 hold makes it effective on
# docs-only diffs). Unlike docs/legal's tier-1 override, the tier-2 hold
# is releasable by the bypass label — a label click on an ADR PR is a
# human decision on that PR, which is what the contract asks. BB twin:
# bb-automerge.py HIGH_RISK_PATTERNS (topcoder1/dotclaude#266).
#
# THIRD EXCEPTION, same shape: `^docs/(marketing|pricing|product-page)`
# (added 2026-08-30). Customer-facing PRICING wording — a wrong published
# price is a public commitment, and CI can no more check that a price is
# the one we agreed to sell at than it can check a clause is true.
#
# This is a deliberate amendment to the paragraph above, not an oversight
# of it: that text names marketing/pricing as caller-side BECAUSE layouts
# differ, and this exception is scoped to the one layout that does not —
# the conventional docs/ tree. Measured before adding, across all 140
# repos in topcoder1 + whois-api-llc: exactly TWO carry any of these
# directories — whois-api-llc/wxa_vpn and topcoder1/inbox_superpilot,
# whose docs/marketing/ holds PRICING_FEATURE_MATRIX_AND_SPLIT_INBOX.md
# and positioning-onepager.md, i.e. the same category. So it provably
# cannot over-block; 96 repos have no docs/ tree at all and 42 have one
# with none of these names.
#
# Why caller-side alone was NOT enough, which is the whole reason this is
# here: safe-paths-automerge.yml decides on diff CONTENT and never reads
# risk-paths.yml, so a docs-only pricing diff is armed by its `^docs/.*`
# safe glob no matter what the caller classifies. A repo can follow the
# paragraph above perfectly and still ship an unreviewed price change —
# the caller-side listing is necessary and not sufficient. Lesson
# 2026-08-30, whois-api-llc/wxa_vpn#1718: docs/marketing/
# pricing-block-handoff.md is pasted verbatim into the CMS,
# docs/product-page/*.html is the product page, and docs/marketing-launch/
# 03-seo/schema-json-ld.html is shipped structured data with a literal
# "price" field that Google and the AI answer engines read — all three
# classified `trivial`, i.e. auto-merge eligible.
#
# Note `docs/pricing/**` was ALREADY held incidentally, by the
# billing|payment|pricing segment rule above; this makes that coverage
# intentional and extends it to the marketing and product-page trees,
# which that rule misses (`pricing` is not a whole segment in
# `docs/marketing/pricing-block-handoff.md`).
#
# Boundary is `([/.-]|$)`, not a bare prefix: it must reach
# docs/marketing-launch/ (hyphen) and docs/pricing.md — the canonical
# customer-facing tier+price table, which sits BESIDE docs/pricing/ — while
# leaving docs/marketingnotes.md alone. Tier 2, not tier 1: a price is a
# commercial decision a human can legitimately approve with a label click,
# unlike a contractual clause. BB twin: bb-automerge.py HIGH_RISK_PATTERNS.
#
# This workflow does NOT bypass branch protection. It only enables GitHub's
# "auto-merge" toggle, which still waits for required checks (Claude Review)
# to pass and required reviews to land before merging.
#
# Because the merge itself happens SERVER-SIDE the instant the last required
# check goes green, nothing can consult a reviewer at merge time — so the
# consultation happens at ARM time instead: the final gate before the arm
# (see "Quiet period + unaddressed findings" below, wxa_vpn#1392) waits for
# findings_quiet_minutes of review silence, then runs the unaddressed-findings
# detector, and declines + disarms when a finding is newer than the last
# authored commit. It applies to every arm path (bypass labels included), is
# not a required check, and never blocks the manual merge button.
#
# DECISION LABELS (wxa-graph#476/#478, 2026-08-28): every deliberate
# abstention (risk-tier match, findings hold, quiet-cap, base refusal) ends
# with a green run and autoMergeRequest=null — the same signature as the
# cancel-in-progress wedge where no run consumed the state at all. The
# final "Publish arbiter decision label" step therefore reconciles exactly
# one `automerge:*` label onto the PR naming the standing decision
# (`automerge:blocked-classifier`, `automerge:blocked-risk-tier`,
# `automerge:withheld-findings`, `automerge:withheld-quiet-cap`,
# `automerge:refused-base`), and clears them when the PR arms or the
# operator's own hold label takes over. Operator contract: CLEAN + all-green +
# autoMergeRequest=null + an `automerge:*` label = deliberate abstention —
# read the label description for the lever; the same signature with NO
# `automerge:*` label is the wedge shape — re-fire with a human label
# event. Selftest: selftest/test_automerge_decision_label.sh.

on:
  workflow_call:
    inputs:
      merge_method:
        description: "Merge method: merge | squash | rebase"
        required: false
        type: string
        default: "squash"
      override_label:
        description: "Label that forces auto-merge regardless of detection (default 'auto-merge')."
        required: false
        type: string
        default: "auto-merge"
      risk_bypass_label:
        description: "Label that bypasses the risk-tier path check on Claude-authored PRs (Option A). Apply from the PR list with one click instead of click-merging through the PR detail page."
        required: false
        type: string
        default: "auto-merge-approved"
      hold_label:
        description: "Label that durably refuses auto-merge on a Claude-authored PR and revokes it if already armed. Outranks the override/bypass labels and the Codex bypass. To lift the hold: remove the label, then re-enable manually if desired (label removal does not re-trigger this workflow). Set empty to disable."
        required: false
        type: string
        default: "manual-merge"
      nonmain_base_optin_label:
        description: "Label that opts a PR based on a NON-default branch into auto-merge. Non-default bases refuse by default: branch rulesets are conventionally scoped to the default branch, so a feature-branch base has no required checks and `--auto` merges on the spot (wxa-jake-ai#1027). This label does NOT lift the unconditional refusal when the base is another OPEN PR's head. Set empty to refuse every non-default base with no opt-in path."
        required: false
        type: string
        default: "auto-merge-nonmain"
      codex_check_name:
        description: "Status-check name for Codex Review. When this check is SUCCESS on a Claude-authored PR, the risk-tier check is bypassed (Option B). Set empty to disable Codex-trusted bypass."
        required: false
        type: string
        default: "review / Codex Review"
      risk_main_go:
        description: "Treat ANY main.go change as risk-tier (manual merge). Default true. Set false in Go monorepos where most cmd/*/main.go are dev tools rather than the deployed service — the bare main.go pattern can't tell cmd/<service>/main.go from cmd/<tool>/main.go. When false, gate the real service entrypoint via the caller's .github/risk-paths.yml instead."
        required: false
        type: boolean
        default: true
      findings_quiet_minutes:
        description: "Quiet period (minutes) the PR must be free of new commits, review-bot comments and review triggers (ready_for_review / reopened) before auto-merge is armed, after which the unaddressed-findings check runs (wxa_vpn#1392: findings posted 3-16 min after the last push merged unanswered; #1512: a draft readied after 2h09m idle cleared the window without waiting at all and armed 35s before a REGRESSION verdict). Applies to EVERY arm path, bypass labels included — the escape for a wrong finding is the manual merge click, which this gate never blocks. Set 0 to disable the whole gate (no wait, no findings check)."
        required: false
        type: number
        default: 20
    secrets:
      automerge_pat:
        description: >-
          Optional fine-grained PAT (or GitHub App token) used to enable
          auto-merge. When set, the resulting merge commit is attributed
          to the PAT user and triggers downstream push-on-main workflows
          (e.g. deploy). When unset, the workflow falls back to the
          built-in GITHUB_TOKEN — auto-merge still works, but the merge
          is attributed to app/github-actions and GitHub silently
          suppresses downstream workflow runs (the GITHUB_TOKEN
          loop-prevention rule). Verified on topcoder1/wxa_webcat#201
          (2026-05-04). Required scopes for a fine-grained PAT - repo
          contents r/w, pull-requests r/w. Wire via `secrets: inherit`
          in the caller, or pass explicitly. See the README for setup.
        required: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
      # NOTE: Option B (Codex-trusted bypass) queries the check-runs API,
      # which requires `checks: read`. We do NOT request it here at the
      # reusable's job level because that would cap-mismatch with the 44+
      # existing fleet callers that grant only contents+pull-requests at
      # the workflow level — startup_failure on every existing caller's
      # next Claude PR (caught on whois-api-llc/wxa-mcp-server#80, run
      # 25292746179, before broad rollout).
      #
      # Callers that want Option B working should add `checks: read` to
      # THEIR workflow-level permissions block. The Codex bypass step
      # below already handles missing permission gracefully (returns
      # bypass=0 with no crash via `gh api ... || echo '{}'` + jq `try`),
      # so callers without `checks: read` simply never bypass via Codex —
      # the label bypass (Option A) and the original "no risky paths"
      # path still work.
    steps:
      - name: Checkout PR head
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect Claude authorship
        id: detect
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OVERRIDE_LABEL: ${{ inputs.override_label }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          claude=0
          reason=""

          # 1. Branch prefix
          case "$BRANCH" in
            claude/*) claude=1; reason="branch=$BRANCH";;
          esac

          # 2. Co-Authored-By trailer in any PR commit
          if [ "$claude" -eq 0 ]; then
            if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -qiE '^Co-Authored-By:\s*Claude'; then
              claude=1
              reason="trailer"
            fi
          fi

          # 3. Override label
          if [ "$claude" -eq 0 ]; then
            if echo "$LABELS_JSON" | jq -e --arg L "$OVERRIDE_LABEL" '.[] | select(.name == $L)' >/dev/null 2>&1; then
              claude=1
              reason="label=$OVERRIDE_LABEL"
            fi
          fi

          echo "claude_authored=$claude" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Detection: claude_authored=$claude reason=$reason"

      # Classifier verdict, computed race-free at decision time.
      #
      # HISTORY — why this step no longer trusts the label alone.
      # pr-classify and this workflow both fire on the same pull_request
      # event. The old design read the live risk:* labels and documented
      # this mitigation: "the caller wires `labeled` into trigger types,
      # so once the classifier applies the label this workflow re-runs
      # and the revoke step disables any auto-merge enabled on the first
      # pass." That re-run is structurally unreachable: pr-classify
      # labels with GITHUB_TOKEN, and GITHUB_TOKEN-attributed events
      # NEVER trigger workflows (GitHub's recursion prevention). So when
      # this workflow won the race, nothing revoked the arm. Evidence,
      # whois-api-llc/wxa-secrets#27 (2026-07-17 UTC): both workflows
      # fired on ready_for_review at 00:40:37; this one read live labels
      # at 00:40:43 (none yet), armed at 00:40:46; pr-classify applied
      # risk:blocked at 00:40:50 — 4s late — and the PR merged at
      # 00:42:30 when required checks went green. Every repo-specific
      # blocked:/sensitive: path not covered by the global regex below
      # had this race.
      #
      # FIX — compute the verdict ourselves, synchronously:
      #
      #  1. Belt-and-suspenders: honor a live risk:blocked/risk:sensitive
      #     label if one already landed (covers hand-applied labels; a
      #     label can only ADD gating here, never remove it).
      #  2. Authoritative: read .github/risk-paths.yml from the PR's
      #     BASE branch — NOT the PR head, so a PR cannot edit its own
      #     risk file to escape — and classify the PR's changed files
      #     with the same classify.mjs pr-classify fetches (both pull it
      #     from topcoder1/ci-workflows@default-branch: one matcher,
      #     zero glob-semantics drift). blocked/sensitive ⇒ refuse.
      #
      # Fail-closed rules: risk-paths.yml unreadable for any reason other
      # than a definitive 404 ⇒ fail the run (auto-merge never armed);
      # classify.mjs guard/parse errors OR output outside the known class
      # enum ⇒ fail; changed-file listing truncated at the REST 3000-file
      # cap ⇒ fail. A 404 on the BASE ref falls back to the DEFAULT
      # branch's risk-paths.yml (a release/legacy base that predates the
      # policy file must not dodge the repo's policy — codex round-2 P1);
      # only when the file is absent there too does the repo count as
      # policy-free, and then the global risk-tier regex below still
      # gates, which matches pre-classifier behavior (automerge-only
      # repos without pr-classify stay supported). No `checks: read` is
      # needed for any of this (deliberate: e.g. the wxa-secrets caller
      # omits it to keep the Codex bypass disabled).
      #
      # Deliberately NOT pinned: classify.mjs and its vendored dep bundle
      # (classifier-deps.mjs) are fetched from this repo's default branch —
      # the SAME source pr-classify.yml uses. Pinning only this side to an
      # immutable ref would reintroduce matcher drift between the two
      # workflows, which is the exact bug class this gate exists to close;
      # callers reference the reusable @main anyway, so a pin here adds no
      # supply-chain isolation in practice.
      #
      # The dep VERSIONS are now pinned exactly, in the committed bundle
      # (yaml@2.9.0, minimatch@10.2.6 — see scripts/build-classifier-deps.sh).
      # They used to float on `yaml@2`/`minimatch@10`, resolved independently
      # here and in pr-classify.yml at run time, so the two matchers could
      # differ by a patch release even on the same PR. Both now load identical
      # bytes.
      - name: Setup Node (risk-paths classification)
        id: setup_node
        if: steps.detect.outputs.claude_authored == '1'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check classifier verdict
        id: classifier_verdict
        if: steps.detect.outputs.claude_authored == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          retry() { local i out; for i in 1 2 3; do if out=$("$@"); then printf '%s' "$out"; return 0; fi; [ "$i" -lt 3 ] && sleep $((i * 5)); done; return 1; }
          blocked=0
          verdict_label=""
          verdict_source=""
          rules_ref="$BASE_REF"

          # Signal 1 (belt-and-suspenders): a risk:* label that already
          # landed. Query the API, not the event payload — labels in the
          # event snapshot are frozen at event time. A HAND-APPLIED risk
          # label is an independent signal the file classification below
          # cannot reconstruct (a human may know context no path glob
          # carries), so an unreadable label set FAILS CLOSED after
          # retries rather than degrading to "no label" (codex round-3
          # P1 — the earlier fail-open here was masked by Signal 2 in
          # the blocked-path case but lost hand-applied labels on
          # benign-path PRs).
          labels=$(retry gh api "/repos/${GITHUB_REPOSITORY}/issues/$PR/labels?per_page=100" \
            --paginate --jq '.[].name') || {
            echo "::error::could not read PR labels after 3 attempts — refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
            exit 1
          }
          if echo "$labels" | grep -qx 'risk:blocked'; then
            blocked=1; verdict_label="risk:blocked"; verdict_source="label"
          elif echo "$labels" | grep -qx 'risk:sensitive'; then
            blocked=1; verdict_label="risk:sensitive"; verdict_source="label"
          fi

          # Signal 2 (authoritative, race-free): classify the changed
          # files ourselves against the base branch's risk-paths.yml.
          if [ "$blocked" -eq 0 ]; then
            # Rules file for a given ref. A 404 is definitive (file absent
            # at that ref); anything else retries, then FAILS CLOSED —
            # never arm auto-merge under an unreadable policy. Sets
            # rp_state=present|absent and rp_b64 via globals.
            rp_state=""
            rp_b64=""
            read_rules() {
              local ref="$1" i rp_err
              rp_state=""
              for i in 1 2 3; do
                rp_err=$(mktemp)
                if rp_b64=$(gh api -X GET \
                      "repos/${GITHUB_REPOSITORY}/contents/.github/risk-paths.yml" \
                      -f ref="$ref" --jq '.content' 2>"$rp_err"); then
                  rp_state="present"; rm -f "$rp_err"; return 0
                fi
                if grep -q 'HTTP 404' "$rp_err"; then
                  rp_state="absent"; rm -f "$rp_err"; return 0
                fi
                cat "$rp_err" >&2; rm -f "$rp_err"
                [ "$i" -lt 3 ] && sleep $((i * 5))
              done
              echo "::error::could not read .github/risk-paths.yml@${ref} after 3 attempts — refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
              exit 1
            }
            read_rules "$rules_ref"
            # Absent on the base ref ⇒ fall back to the DEFAULT branch's
            # policy. A PR targeting a release/legacy branch created before
            # risk-paths.yml existed must not dodge the repo's policy
            # (codex round-2 P1). Only when the default branch lacks the
            # file too is the repo genuinely policy-free.
            if [ "$rp_state" = "absent" ] && [ -n "$DEFAULT_BRANCH" ] && [ "$rules_ref" != "$DEFAULT_BRANCH" ]; then
              echo "No .github/risk-paths.yml on ${rules_ref} — falling back to the default branch's policy (${DEFAULT_BRANCH})."
              rules_ref="$DEFAULT_BRANCH"
              read_rules "$rules_ref"
            fi

            if [ "$rp_state" = "present" ]; then
              # Changed-file names via the paginated files API (same call
              # and same 3000-file fail-closed cap as pr-classify.yml).
              changed=$(retry gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
                --paginate --jq '.[].filename') || {
                echo "::error::could not list PR changed files after 3 attempts — refusing to arm auto-merge (fail closed)."
                exit 1
              }
              if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ge 3000 ]; then
                echo "::error::PR changes 3000+ files — file listing is truncated, cannot classify. Merge manually."
                exit 1
              fi

              # Same classifier pr-classify.yml runs, fetched from the same
              # place, run in a scratch dir so the PR checkout's own (head)
              # risk-paths.yml is never consulted. classify.mjs failures
              # (bracket/negation guards, YAML parse) exit nonzero ⇒ this
              # step fails ⇒ fail closed, identical to pr-classify staying
              # red on the same repo.
              work=$(mktemp -d)
              mkdir -p "$work/repo/.github"
              printf '%s' "$rp_b64" | base64 -d > "$work/repo/.github/risk-paths.yml"
              fetch_mjs() {
                gh api "repos/topcoder1/ci-workflows/contents/.github/scripts/$1" \
                  --jq '.content'
              }
              # classify.mjs plus the vendored, version-pinned dep bundle it
              # imports relatively. This install was already isolated in $work
              # (no caller package.json to drag in), so the latency fix that
              # motivated vendoring does not apply here — but the DRIFT fix
              # does, and this gate is the reason it matters. The comment above
              # explains that pinning only one side would reintroduce matcher
              # drift between this workflow and pr-classify.yml; with both
              # floating on `yaml@2`/`minimatch@10` they resolved independently
              # at run time, so two runs minutes apart could already match with
              # different minimatch patches. One committed bundle makes the two
              # matchers byte-identical, which is what these comments claimed
              # all along.
              for s in classify.mjs classifier-deps.mjs; do
                retry fetch_mjs "$s" | base64 -d > "$work/$s"
                if [ ! -s "$work/$s" ]; then
                  echo "::error::fetched an empty $s from topcoder1/ci-workflows — refusing to arm auto-merge (fail closed)."
                  exit 1
                fi
              done
              class=$(cd "$work/repo" && printf '%s\n' "$changed" | node "$work/classify.mjs")
              echo "risk-paths.yml@${rules_ref} verdict: $class"
              # Closed enum: anything outside the classifier's documented
              # classes (a garbled/partial line, an empty string, a future
              # class this workflow doesn't know) must FAIL CLOSED, not
              # fall through as benign (codex round-2 P2).
              case "$class" in
                blocked|sensitive)
                  blocked=1; verdict_label="risk:$class"; verdict_source="risk-paths"
                  ;;
                standard|safe_test|safe_deps|safe_config|trivial)
                  ;;
                *)
                  echo "::error::classify.mjs printed unexpected class '$class' — refusing to arm auto-merge (fail closed)."
                  exit 1
                  ;;
              esac
            else
              echo "No .github/risk-paths.yml on ${BASE_REF} or the default branch — no repo-specific policy; the global risk-tier regex still applies."
            fi
          fi

          {
            echo "blocked=$blocked"
            echo "verdict_label=$verdict_label"
            echo "verdict_source=$verdict_source"
          } >> "$GITHUB_OUTPUT"
          if [ "$blocked" -eq 1 ]; then
            case "$verdict_source" in
              label) why="labeled $verdict_label by pr-classify" ;;
              *) why="classified $verdict_label against risk-paths.yml@${rules_ref}" ;;
            esac
            echo "::warning::PR $why — auto-merge refused (manual click-merge required; no label or status-check bypass applies)"
          fi

      # Revoke auto-merge if a previous run of this workflow enabled it
      # before this gate could see the verdict (armed before the direct
      # risk-paths read existed, base risk policy expanded since, or a
      # risk label hand-applied later). Idempotent — `gh pr
      # merge --disable-auto` returns non-zero when auto-merge wasn't
      # on; we tolerate that with `|| true` and verify state via the
      # follow-up gh pr view.
      - name: Revoke auto-merge if classifier blocked
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          state=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "OFF" else "ON" end')
          echo "Auto-merge state after revoke: $state"
          if [ "$state" = "ON" ]; then
            echo "::error::auto-merge still ON after --disable-auto — investigate"
            exit 1
          fi

      # Durable manual hold (lesson 2026-07-02, whois-api-llc/techrecon#405):
      # a human ran `gh pr merge --disable-auto` (timeline 17:16:40Z) and an
      # in-flight run of this workflow re-armed auto-merge 11 seconds later
      # (17:16:51Z); the PR then merged with no human click. `--disable-auto`
      # is the documented escape hatch in the fleet policy, so it must
      # survive workflow re-runs. Two hold signals, checked at enable time:
      #
      #  1. hold_label (default 'manual-merge') — explicit one-click hold
      #     from the PR list page; also revokes an already-armed auto-merge
      #     (next step). Outranks Option A/B bypasses and the override
      #     label: contradictory signals resolve to manual.
      #  2. Timeline — a HUMAN turned auto-merge OFF after it was last on:
      #     do not re-arm. Two subtleties this logic must get right, both
      #     found by adversarial review of the first cut of this step:
      #
      #     (a) Chronology, not lexicography. We take the MAX created_at
      #         among auto-merge events and, on a same-second tie, resolve
      #         toward "disabled" (fail-safe). The earlier cut sorted the
      #         string "<ts> <event>" and let the event NAME break ties —
      #         and `auto_merge_disabled` sorts before every enable event
      #         (auto_merge_enabled / auto_squash_enabled /
      #         auto_rebase_enabled: 'd' < 'e'/'m'/'r'/'s'), so a human
      #         disable colliding in the same wall-clock second as an
      #         in-flight re-arm was silently dropped and auto-merge
      #         re-armed against the human — the exact #405 defeat this step
      #         exists to prevent. GitHub timeline created_at is
      #         whole-second precision, so same-second collisions are real.
      #
      #     (b) Actor: exclude OUR OWN revokes. The classifier-revoke and
      #         hold-label-revoke steps also emit auto_merge_disabled, via
      #         GITHUB_TOKEN, so they show actor `github-actions[bot]`.
      #         A human `gh pr merge --disable-auto` shows the human's login
      #         (verified live: #405 disable = "topcoder1"; fleet
      #         classifier-revokes = "github-actions[bot]"). If we treated a
      #         bot revoke as a durable hold, a PR that was armed→revoked on
      #         the arm-before-classify race and later de-risked (sensitive
      #         path removed → reclassified non-blocked) would be stranded
      #         forever even though no human ever disabled it. So Signal 2
      #         holds only on a HUMAN disable (actor != github-actions[bot]).
      #         Note: actor cannot distinguish enable-from-disable (both the
      #         PAT user), which is why chronology+event-type carries that;
      #         actor is used ONLY to filter self-revokes out of disables.
      #
      #     To resume auto-merge after a human disable, re-enable manually
      #     (`gh pr merge --auto --<method>`) — labels do NOT clear a
      #     timeline hold.
      #
      # Both reads go through the issues API namespace the classifier-verdict
      # step already uses in production, and both FAIL CLOSED after 3
      # attempts (same retry/backoff as the classifier-verdict reads): an
      # unreadable hold signal must never be read as "no hold" — that would
      # let an API blip defeat the human's explicit hold under precisely
      # the conditions (API misbehavior) where the defense matters, the
      # same rationale that hardened the classifier-verdict label read
      # (codex round-3 P1). An earlier revision promised the opposite
      # ("degrades gracefully — can never crash the run"); that trade was
      # wrong: a red run costs a re-run or a manual click, while a silently
      # dropped hold costs an unwanted merge of exactly the PR a human
      # flagged. Failing here never arms auto-merge (a failed step skips
      # the enable step), and the always() error-revoke step at the end of
      # the job — which counts steps.hold in its outcome list — disarms any
      # arm a previous run already enabled, so a red read is safe for
      # already-armed PRs too.
      #
      # Pagination is part of the same no-silent-loss contract: the label
      # read paginates like the classifier's (a hold label past the
      # 30-label default page must not read as absent), and the timeline
      # aggregation runs across ALL pages in one jq pass — see the Signal 2
      # comment for the per-page-max defect this replaces. Behavior pinned
      # by selftest/test_automerge_hold_gate.sh.
      - name: Check manual hold
        id: hold
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HOLD_LABEL: ${{ inputs.hold_label }}
        run: |
          set -euo pipefail
          retry() { local i out; for i in 1 2 3; do if out=$("$@"); then printf '%s' "$out"; return 0; fi; [ "$i" -lt 3 ] && sleep $((i * 5)); done; return 1; }
          hold=0
          reason=""

          # Signal 1: hold label. Query live labels, not the event snapshot —
          # the label may have been applied after the triggering event fired.
          # Paginated for the same reason as the classifier-verdict label
          # read: a hold label past the 30-label default page must not read
          # as absent.
          if [ -n "$HOLD_LABEL" ]; then
            labels=$(retry gh api "/repos/${GITHUB_REPOSITORY}/issues/$PR/labels?per_page=100" \
              --paginate --jq '.[].name') || {
              echo "::error::could not read PR labels after 3 attempts — cannot rule out a '$HOLD_LABEL' hold; refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
              exit 1
            }
            if echo "$labels" | grep -qxF "$HOLD_LABEL"; then
              hold=1
              reason="label:$HOLD_LABEL"
            fi
          fi

          # Signal 2: the chronologically-last auto-merge state event is a
          # HUMAN disable. jq does all the ordering (no shell sort of a mixed
          # "<ts> <event>" key): filter to auto-merge state events, find the
          # max created_at, and among events at that max timestamp, hold iff
          # any is a disable NOT emitted by github-actions[bot] (i.e. a human
          # --disable-auto, not our own classifier/hold revoke). Ties resolve
          # toward the human disable — fail-safe. See the step's header
          # comment for why (a) chronology and (b) actor both matter.
          #
          # The jq runs ONCE across all pages (-s, then add): `gh api
          # --paginate` emits each page as its own top-level JSON array, so
          # a plain per-input filter computes a PER-PAGE max and prints one
          # verdict line per page — multi-line output the string comparison
          # below can never equal, i.e. any PR whose timeline crossed one
          # page silently reported "no hold". And no `try`: a body that
          # does not parse or shape-check is an UNKNOWN hold state, which
          # fails closed below, never open.
          if [ "$hold" -eq 0 ]; then
            timeline=$(retry gh api "/repos/${GITHUB_REPOSITORY}/issues/$PR/timeline?per_page=100" \
              --paginate) || {
              echo "::error::could not read the PR timeline after 3 attempts — cannot rule out a human auto-merge disable; refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
              exit 1
            }
            human_disable=$(printf '%s' "$timeline" | jq -rs '
                (add // [])
                | [ .[] | select(.event == "auto_merge_disabled"
                      or .event == "auto_merge_enabled"
                      or .event == "auto_squash_enabled"
                      or .event == "auto_rebase_enabled") ]
                | (map(.created_at) | max) as $t
                | if $t == null then "no"
                  elif any(.[]; .created_at == $t
                        and .event == "auto_merge_disabled"
                        and ((.actor.login // "") != "github-actions[bot]"))
                  then "yes" else "no" end') || {
              echo "::error::PR timeline response did not parse — refusing to arm auto-merge (fail closed)."
              exit 1
            }
            if [ "$human_disable" = "yes" ]; then
              hold=1
              reason="timeline:human-disable-newest"
            fi
          fi

          echo "hold=$hold" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$hold" -eq 1 ]; then
            echo "::notice::Manual hold respected ($reason) — auto-merge will not be (re-)enabled. Re-enable manually to lift a timeline hold; remove the '$HOLD_LABEL' label to lift a label hold."
          else
            echo "No manual hold detected."
          fi

      # A label hold also revokes an auto-merge that was armed before the
      # label landed (same idempotent pattern as the classifier revoke).
      # Timeline holds need no revoke — by definition auto-merge is already
      # off when the newest event is a disable.
      - name: Revoke auto-merge on hold label
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          startsWith(steps.hold.outputs.reason, 'label:')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          state=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "OFF" else "ON" end')
          echo "Auto-merge state after hold-label revoke: $state"
          if [ "$state" = "ON" ]; then
            echo "::error::auto-merge still ON after --disable-auto — investigate"
            exit 1
          fi

      # Base-branch gate. Runs AFTER the hold so a durable hold always wins
      # the reason line, and BEFORE the risk/bypass lane so no bypass label
      # and no Codex pass can talk past it.
      #
      # whois-api-llc/wxa-jake-ai#1027 (2026-07-28): a PR opened against
      # another OPEN PR's head branch squash-merged 68 seconds after it was
      # created, growing that PR's diff from 6 files to 8 files AFTER its
      # 4-round codex review had completed — the human is then asked to
      # click merge on a diff nobody reviewed. Branch rulesets are
      # conventionally scoped to the default branch (`ref_name:
      # ~DEFAULT_BRANCH`), so a feature-branch base has NO required checks
      # and `gh pr merge --auto` merges on the spot instead of waiting.
      #
      # That instant merge is what makes this a security gap rather than a
      # routing quirk: every other protection in this lane is latency-shaped
      # (a caller-side classification gate, this workflow's own hold read)
      # and silently assumes there is a wait to lose. Remove the wait and
      # the unguarded arm always wins. In #1027 the losing disarm started 7
      # seconds after the merge had already landed.
      #
      # Policy: the default branch is the only ref the ruleset protects, so
      # it is the only base where "auto-merge" means "merge after required
      # checks and review". Other bases refuse unless a human opts in
      # per-PR. A base that is itself an open PR's head refuses outright —
      # not overridable — because that is the review-scope-expansion vector.
      #
      # Fail-closed: an unreadable PR listing or label set is an UNKNOWN
      # base state, which must never read as "no refusal".
      - name: Check base branch
        id: base_gate
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          steps.hold.outputs.hold != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPTIN_LABEL: ${{ inputs.nonmain_base_optin_label }}
        run: |
          set -euo pipefail
          retry() { local i out; for i in 1 2 3; do if out=$("$@"); then printf '%s' "$out"; return 0; fi; [ "$i" -lt 3 ] && sleep $((i * 5)); done; return 1; }
          refuse=0
          reason=""

          if [ -z "$BASE_REF" ] || [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::empty base ref ('$BASE_REF') or default branch ('$DEFAULT_BRANCH') — cannot establish the base is protected; refusing to arm auto-merge (fail closed)."
            exit 1
          fi

          # The open-PR-head check below is deliberately scoped to NON-default
          # bases. Review raised the `main -> release` train shape, where the
          # default branch is itself an open PR's head; applying the check
          # there would refuse auto-merge for EVERY PR in every such repo for
          # as long as that release PR stays open — a fleet-wide liveness
          # regression. The trade is wrong in both directions: this invariant
          # exists to stop merges into an UNPROTECTED branch someone is
          # reviewing as a fixed diff, and the default branch is neither —
          # it is ruleset-protected, and a release train PR is by
          # construction expected to accumulate whatever lands on it.
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            # Listed with a NON-aggregating jq: `gh api --paginate` emits one
            # JSON array per page, so an aggregating filter would compute a
            # per-page answer and print one line per page (the multi-page
            # defect pinned in test_automerge_hold_gate.sh). This streams
            # every page's refs into one newline-separated list.
            #
            # Same-repo heads only. A fork PR's `.head.ref` is just a branch
            # name in the fork, so an unrelated fork branch called `develop`
            # would otherwise read as "the parent PR's head" and refuse a
            # legitimate opted-in merge (codex P2). `.head.repo` is null when
            # a fork is deleted; in jq that yields null, which compares
            # unequal and is filtered out — the safe direction.
            open_heads=$(retry gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --paginate --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .head.ref') || {
              echo "::error::could not list open PRs after 3 attempts — cannot rule out that '$BASE_REF' is another open PR's head; refusing to arm auto-merge (fail closed). Re-run when the API recovers, or merge manually."
              exit 1
            }
            if grep -qxF "$BASE_REF" <<<"$open_heads"; then
              # Deliberately NOT liftable by OPTIN_LABEL: opting into a
              # plain integration branch is a routing choice; opting into
              # rewriting an under-review PR's diff is not one a label
              # should be able to make.
              refuse=1
              reason="base '$BASE_REF' is the head branch of another open PR — merging would expand that PR's diff after its review"
            elif [ -n "$OPTIN_LABEL" ]; then
              labels=$(retry gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels?per_page=100" \
                --paginate --jq '.[].name') || {
                echo "::error::could not read PR labels after 3 attempts — cannot confirm a '$OPTIN_LABEL' opt-in; refusing to arm auto-merge (fail closed)."
                exit 1
              }
              if grep -qxF "$OPTIN_LABEL" <<<"$labels"; then
                echo "::notice::base '$BASE_REF' is not the default branch, but '$OPTIN_LABEL' opts in explicitly."
              else
                refuse=1
                reason="base '$BASE_REF' is not the default branch ('$DEFAULT_BRANCH') and the '$OPTIN_LABEL' opt-in label is absent"
              fi
            else
              refuse=1
              reason="base '$BASE_REF' is not the default branch ('$DEFAULT_BRANCH') and the non-default-base opt-in is disabled"
            fi
          fi

          {
            echo "refuse=$refuse"
            echo "reason=$reason"
            # Published so the arm can re-bind to the routing THIS run
            # validated — see the re-read in "Enable auto-merge".
            echo "base_ref=$BASE_REF"
          } >> "$GITHUB_OUTPUT"
          if [ "$refuse" -eq 1 ]; then
            echo "::notice::Auto-merge withheld: $reason. Manual merge remains available."
          else
            echo "Base '$BASE_REF' cleared."
          fi

      # Same idempotent revoke as the hold label: a base refusal must also
      # disarm an arm placed by an earlier run (or by hand) — "refusing to
      # arm" alone is not fail-closed for a PR that is already armed.
      - name: Revoke auto-merge on base-gate refusal
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.base_gate.outputs.refuse == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          GATE_BASE_REF: ${{ steps.base_gate.outputs.base_ref }}
        run: |
          set -euo pipefail
          # Ownership guard, mirroring the error-revoke's head-moved check.
          # This verdict describes the base THIS run evaluated. Retargeting
          # from a refused base onto an allowed one fires no event of its
          # own, but any later subscribed event (a push, a label) starts a
          # newer run that can validly arm — and this older run would then
          # strand the PR by revoking a decision made from current state.
          # Skip only on a POSITIVE differing read; if the read fails, revoke
          # anyway (fail toward safety — a rare stale disarm self-heals on
          # the next event, an unreviewed merge does not).
          #
          # This is deliberately NOT symmetric with the pre-arm disarm in
          # "Enable auto-merge", which stays unconditional on a base change.
          # There, the run HOLDS a live read proving the arm it is about to
          # place was validated against a base that is no longer current, and
          # nothing re-gates a retarget. Here the VERDICT is the stale
          # artifact, and whichever run placed any live arm validated the
          # base itself at arm time.
          now_base=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .base.ref 2>/dev/null || echo "")
          if [ -n "$now_base" ] && [ -n "$GATE_BASE_REF" ] && [ "$now_base" != "$GATE_BASE_REF" ]; then
            echo "::notice::base changed ('$GATE_BASE_REF' → '$now_base') since this run's gate — this refusal is stale and a newer run owns the arm decision; skipping revoke."
            exit 0
          fi
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          state=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "OFF" else "ON" end')
          echo "Auto-merge state after base-gate revoke: $state"
          if [ "$state" = "ON" ]; then
            echo "::error::auto-merge still ON after --disable-auto — investigate"
            exit 1
          fi

      # Option A: explicit human approval via label.
      # Run BEFORE the risk-tier path-scan so a PR the scan can't
      # classify can still bypass-merge. Historically that meant any
      # >20k-line diff: the scan fetched names via `gh pr diff`, which
      # HTTP-406s past 20k lines (topcoder1/attaxion_dev#71, 2026-05-04,
      # 261k-line data drop, died before consulting this label — hence
      # the ordering). The scan now lists names via the paginated files
      # API (dotclaude#121, 2026-07-02), so diff size no longer kills it;
      # the remaining can't-run case is the REST 3000-file listing cap,
      # where the scan fails closed.
      #
      # When a Claude PR matches the risk-tier classifier (or the
      # path-scan can't run), you can apply the `auto-merge-approved`
      # label from the PR list page (one click, no PR detail navigation)
      # to bypass the risk gate. Confirms "yes I read it, auto-merge it"
      # without requiring the actual click-merge round-trip.
      - name: Check risk bypass label (Option A)
        id: bypass_label
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1'
        env:
          BYPASS_LABEL: ${{ inputs.risk_bypass_label }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          if [ -z "$BYPASS_LABEL" ]; then
            echo "bypass=0" >> "$GITHUB_OUTPUT"
            echo "Bypass label disabled (input empty)."
            exit 0
          fi
          if echo "$LABELS_JSON" | jq -e --arg L "$BYPASS_LABEL" '.[] | select(.name == $L)' >/dev/null 2>&1; then
            echo "bypass=1" >> "$GITHUB_OUTPUT"
            echo "Bypass label '$BYPASS_LABEL' present — risk-tier gate overridden (path-scan will be skipped)."
          else
            echo "bypass=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check risk-tier paths
        id: risk
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          steps.bypass_label.outputs.bypass != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RISK_MAIN_GO: ${{ inputs.risk_main_go }}
          BYPASS_LABEL: ${{ inputs.risk_bypass_label }}
        run: |
          set -euo pipefail
          # Changed-file names via the paginated files API — `gh pr diff
          # --name-only` HTTP-406s on diffs >20k lines (dotclaude#121).
          # The listing endpoint caps at 3000 files; past that the scan
          # can't see every path, so fail closed (the bypass label above
          # stays the human override).
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[].filename')
          if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ge 3000 ]; then
            echo "::error::PR changes 3000+ files — file listing is truncated and the risk scan cannot classify every path. Apply the '${BYPASS_LABEL:-auto-merge-approved}' label or merge manually."
            exit 1
          fi
          # Renames report ONLY their destination in `.filename`; the source
          # is in `.previous_filename`. Without it, MOVING a risky file out
          # of a risky path — `docs/legal/aup.md` → `docs/archive/aup.md`,
          # or `src/auth/login.py` → `src/util/login.py` — reads as an
          # ordinary change and escapes the gate, even though deleting a
          # policy from its canonical location is exactly the edit that
          # needs a human. Scanning both ends can only ADD risk
          # classification, never remove it, so it always fails toward
          # manual merge. Appended AFTER the 3000-file count so rename
          # sources cannot push a large-but-listable PR over the cap.
          # (Codex review round 9.)
          renamed_from=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --paginate --jq '.[] | select(.previous_filename) | .previous_filename' 2>/dev/null || echo "")
          if [ -n "$renamed_from" ]; then
            changed=$(printf '%s\n%s' "$changed" "$renamed_from")
          fi
          # Risk-tier glob patterns (kept in sync with global CLAUDE.md policy).
          # If you add a category, also update install-automerge-policy.sh and
          # the CLAUDE.md policy block.
          patterns='^(.*/)?(auth|login|signin|signup|logout|session[s]?|oauth|oauth2|sso|jwt|mfa|totp|webauthn|passkey)(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^(.*/)?secret[s]?(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^(.*/)?\.env($|\..*)
          ^(.*/)?keychain.*
          ^(.*/)?credentials.*
          ^(.*/)?migrations(/|$)
          .*\.sql$
          ^(.*/)?(billing|payment[s]?|pricing|invoice[s]?|subscription[s]?|checkout|refund[s]?)(/|\.(py|go|ts|tsx|js|jsx)$|$)
          ^docs/legal/.*
          ^docs/decisions/.*
          ^docs/(marketing|pricing|product-page)([/.-]|$)
          (^|/)naf(/|\.(py|go|ts|js)$)
          (^|/)main\.go$
          (^|/)Dockerfile(\..*)?$
          ^docker-compose.*\.ya?ml$
          (^|/)docker/docker-compose.*\.ya?ml$
          ^\.github/workflows/.*
          ^templates/ci-workflows/.*
          ^\.github/actions?/.*
          ^\.github/scripts/.*
          (^|/)action\.ya?ml$
          ^\.github/dependabot\.ya?ml$
          ^\.github/risk-paths\.yml$
          ^\.github/CODEOWNERS$
          ^infra/iam/.*
          ^infra/(deploy|terraform|pulumi|k8s|cloudformation|ansible|digitalocean|scanner-id)/.*
          ^infra/nginx.*
          ^infra/.*\.(service|slice|timer|tf|hcl|sh)$
          ^terraform/.*
          ^pulumi/.*
          ^k8s/.*
          ^fly\.toml$
          ^deploy/.*
          (^|/)deploy.*\.(sh|ya?ml)$
          (^|/)ml/predictor\.(py|go|ts|js)$
          (^|/)ml/retrain\.(py|go|ts|js)$'

          # main.go opt-out: in Go monorepos most cmd/*/main.go are dev tools,
          # not the deployed service, and the bare (^|/)main\.go$ pattern can't
          # distinguish them. When risk_main_go=false, drop the main.go pattern
          # so tool entrypoints auto-merge; the caller gates its real service
          # entrypoint via .github/risk-paths.yml instead. Default true keeps
          # the fleet-wide behavior unchanged.
          if [ "${RISK_MAIN_GO:-true}" != "true" ]; then
            patterns="$(printf '%s\n' "$patterns" | grep -vF 'main\.go')"
          fi

          matched=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            while IFS= read -r p; do
              p="${p#"${p%%[![:space:]]*}"}"
              [ -z "$p" ] && continue
              # Root .audit/ evidence dirs hold read-only analysis SQL committed
              # with dated audit runs (wxa_webcat#978: two SELECT-only harness
              # files blocked, 2026-08-26). Exempt them from the migrations-class
              # SQL pattern ONLY — other risk patterns still apply to .audit/
              # paths; nested sub/.audit/ and .audit2/ stay covered (anchor is
              # ^\.audit/). ERE has no lookahead, hence this loop skip; the BB
              # twin is ^(?!\.audit/).*\.sql$ in bb-automerge.py. Shared corpus
              # pins both directions (selftest/risk_patterns_corpus.txt).
              if [ "$p" = '.*\.sql$' ] && echo "$f" | grep -Eq '^\.audit/'; then
                continue
              fi
              if echo "$f" | grep -Eq "$p"; then
                matched="$matched$f (matched: $p)\n"
                break
              fi
            done <<< "$patterns"
          done <<< "$changed"

          if [ -n "$matched" ]; then
            {
              echo "risky=1"
              echo "matched<<EOF"
              printf "%b" "$matched"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Risk-tier match — auto-merge blocked:"
            printf "%b" "$matched"
          else
            echo "risky=0" >> "$GITHUB_OUTPUT"
            echo "No risk-tier paths matched."
          fi

      # Option B: Codex review trust.
      # When the configured Codex status check is SUCCESS, treat the PR as
      # second-model-reviewed and bypass the risk-tier gate. The check name
      # is configurable so callers can wire whatever Codex caller they
      # use (default "review / Codex Review", which matches the
      # pr-codex-review.yml caller in this same repo).
      - name: Check Codex Review status (Option B)
        id: bypass_codex
        if: steps.detect.outputs.claude_authored == '1' && steps.risk.outputs.risky == '1' && steps.bypass_label.outputs.bypass != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: ${{ inputs.codex_check_name }}
        run: |
          set -euo pipefail
          if [ -z "$CHECK_NAME" ]; then
            { echo "bypass=0"; echo "state=disabled"; } >> "$GITHUB_OUTPUT"
            echo "Codex bypass disabled (codex_check_name input empty)."
            exit 0
          fi
          # Look at the head SHA's check-runs and the PR's status checks. Codex
          # callers commonly post as a check-run; some post as a commit status.
          # Match either. We require an explicit SUCCESS — neutral / pending /
          # failure all leave the risk gate in place.
          #
          # Pipe through `jq --arg` instead of `gh api --jq` with shell-
          # interpolated quotes. If CHECK_NAME ever contains a double-quote
          # (custom callers, future variants), inline interpolation would
          # produce a broken jq filter that silently returns nothing —
          # bypass=0, no warning. `--arg` binds the variable safely
          # regardless of contents. Caught by Claude Review on PR #25.
          #
          # Wrap each gh-api call in `|| echo '{}'` and run jq with a guard
          # so the step never crashes the workflow. Failure modes that
          # return invalid JSON: 403 from missing `checks: read` (caught
          # on wxa-mcp-server#80 install run), 404 on commits that haven't
          # propagated yet, network blips. In all cases we want bypass=0,
          # never a workflow crash. Caller's main path ("post the blocked
          # comment") still runs.
          codex_state=$(
            (gh api "/repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" 2>/dev/null \
              || echo '{"check_runs":[]}') \
            | jq -r --arg name "$CHECK_NAME" \
              'try (.check_runs[] | select(.name == $name) | .conclusion) // empty' \
            | head -1
          )
          if [ -z "$codex_state" ]; then
            codex_state=$(
              (gh api "/repos/${{ github.repository }}/commits/$HEAD_SHA/status" 2>/dev/null \
                || echo '{"statuses":[]}') \
              | jq -r --arg name "$CHECK_NAME" \
                'try (.statuses[] | select(.context == $name) | .state) // empty' \
              | head -1
            )
          fi
          echo "Codex check '$CHECK_NAME' state: '${codex_state:-<absent>}'"
          # `state` feeds the risk-tier comment below so the operator sees
          # what the gate actually observed at decision time (absent vs.
          # pending vs. failure) instead of guessing from the checks tab.
          echo "state=${codex_state:-absent}" >> "$GITHUB_OUTPUT"
          if [ "$codex_state" = "success" ] || [ "$codex_state" = "SUCCESS" ]; then
            echo "bypass=1" >> "$GITHUB_OUTPUT"
            echo "Codex Review passed — risk-tier gate overridden."
          else
            echo "bypass=0" >> "$GITHUB_OUTPUT"
          fi

      # Quiet period + unaddressed-findings gate (wxa_vpn#1392). Runs ONLY
      # when every earlier gate has cleared — i.e. the PR would otherwise
      # arm right now — and holds the arm until the review conversation has
      # actually gone quiet, then consults the findings detector. Review
      # bots post findings continuously and a PR can merge seconds later;
      # measured gaps on the 4 incident PRs were 3m18s-16m17s, all inside
      # the 20-minute default. Two halves:
      #
      #   1. QUIET — wait until >= findings_quiet_minutes have passed since
      #      the newest of: the newest AUTHORED (non-merge) commit, the
      #      newest inline review comment (any author — an inline comment
      #      is a deliberate code-level finding), the newest top-level
      #      [bot] comment that is not this workflow's own marker comment
      #      or pr-classify chatter (a gate that counts its own sticky
      #      comment as review activity never opens), the newest
      #      `ready_for_review`/`reopened` event, and the PR's own creation
      #      time — the triggers that START a round of review, without
      #      which the clock is pre-expired on exactly the events that
      #      begin one (wxa_vpn#1512; see c4/c5 above read_anchor for the
      #      measurement — `opened` is in the same `types:` list, so a
      #      branch whose commits idled before the PR was opened non-draft
      #      is the same hole through a different door). Sleeping here is
      #      safe: callers run concurrency cancel-in-progress per PR, so a
      #      new push replaces this run and restarts the clock, and the
      #      arm below binds --match-head-commit so a moved head can never
      #      inherit this run's arm. Chronic chatter is bounded by a 3x
      #      cap, which declines + disarms (fail toward manual).
      #
      #   2. CONSULT — run the unaddressed-findings check (vendored twin
      #      of dotclaude's bb-unaddressed-findings.sh, fetched from this
      #      repo's default branch exactly like classify.mjs). A finding
      #      newer than the last authored commit ⇒ decline to arm, disarm
      #      any arm an earlier run placed, and leave a sticky comment.
      #      Pushing a commit re-gates via its own synchronize run; a
      #      wrong finding is overridden by the one thing this lane never
      #      blocks: the manual click-merge. Measured precision of the
      #      detector on a fresh 25-PR corpus (#1369-#1401) is 90.9%, and
      #      40% of merges carried a real unaddressed finding — the
      #      decline-to-manual cost is small and the caught class is not.
      #
      # This deliberately applies to the bypass-label and Codex-bypass arm
      # paths too: wxa_vpn#1404 merged 56 seconds after a (false) Codex P1
      # precisely because an approval decided minutes earlier raced a
      # review that had not finished speaking. An approval label says "I
      # read what was there", not "nothing further may be said".
      #
      # Fail direction: every error here exits nonzero, which skips the
      # arm and triggers the always() error-revoke below (stale arms from
      # earlier runs are disarmed). No required check is involved anywhere,
      # so this gate can decline a merge but can never wedge a PR.
      - name: Quiet period + unaddressed findings
        id: quiet_findings
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          steps.hold.outputs.hold != '1' &&
          steps.base_gate.outputs.refuse != '1' && (
            steps.risk.outputs.risky != '1' ||
            steps.bypass_label.outputs.bypass == '1' ||
            steps.bypass_codex.outputs.bypass == '1'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          QUIET_MINUTES: ${{ inputs.findings_quiet_minutes }}
          # The c5 anchor (see read_anchor). From the event payload rather
          # than an API read; immutable, so a later labeled/synchronize
          # re-run sees the same fixed value aged out.
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          set -euo pipefail
          retry() { local i out; for i in 1 2 3; do if out=$("$@"); then printf '%s' "$out"; return 0; fi; [ "$i" -lt 3 ] && sleep $((i * 5)); done; return 1; }

          QUIET_S=$(( ${QUIET_MINUTES:-20} * 60 ))
          if [ "$QUIET_S" -le 0 ]; then
            { echo "clear=1"; echo "reason=disabled"; } >> "$GITHUB_OUTPUT"
            echo "Findings gate disabled (findings_quiet_minutes=${QUIET_MINUTES})."
            exit 0
          fi

          # Newest activity the gate must be quiet against. Merge commits
          # are excluded for the same reason the findings check excludes
          # them: an auto-update-branch merge introduces no authored change
          # and must not reset either clock. jq slurps (-s) then `add`s so
          # a --paginate stream (one top-level array per page) aggregates
          # ACROSS pages, not per page — the multi-page defect pinned in
          # test_automerge_hold_gate.sh.
          #
          # c4 — THE REVIEW-TRIGGER ANCHOR, and the reason this gate armed
          # over a live finding on wxa_vpn#1512 (2026-08-14). The other
          # three anchors all measure silence that has ALREADY ELAPSED,
          # which is the right question only when the event that woke this
          # workflow did not itself start a review. `ready_for_review` and
          # `reopened` do exactly that: pr-review.yml, pr-codex-review.yml
          # and this workflow share the same `types:` list, so readying a
          # draft fires the review lanes and arms the gate IN THE SAME
          # INSTANT — while every anchor the gate could read still dates
          # from before the PR was drafted.
          #
          # Measured on #1512: the PR sat as a draft for 2h09m, so at
          # ready_for_review the step logged
          #   Quiet: newest commit/review activity is 7757s old (>= 1200s)
          # cleared the 20-minute window without sleeping once, ran the
          # detector against a conversation the reviews had not joined yet,
          # got a legitimate "no unaddressed findings", and armed at
          # 05:38:26Z. Codex posted VERDICT: REGRESSION at 05:39:01Z — 35
          # seconds later — and the PR merged at 05:42:51Z carrying it.
          # #1518 cleared the same way at 3074s (its review happened to
          # come back clean, so it was a near miss rather than a hit).
          #
          # The fix is not a longer window — no window helps when the clock
          # starts pre-expired. It is to anchor on the moment the CURRENT
          # round of review was triggered, so `ready_for_review` waits
          # exactly as long as a push does. That is not new policy: the
          # push path already waits (wxa_vpn#1513 slept 1162s + 441s and
          # merged clean), and this only stops the ready path from skipping
          # a wait the push path has always taken.
          #
          # These are POINT-IN-TIME event timestamps, not "now", so a later
          # `labeled` run re-reads the same fixed value and sees it age out
          # normally — the gate cannot be held shut by its own re-runs. A
          # PR opened non-draft and never reopened contributes no c4; its
          # `opened` trigger is anchored by c5 (creation time) below.
          #
          # Fail-closed like every sibling read: `issues/{n}/timeline` is
          # already load-bearing in this job (the detector fetched below
          # reads issues/{n}/comments fatally), so an unreadable timeline
          # is an unreadable anchor, not an absent one. What fail-closed
          # covers is READABILITY — the fetch and the parse. A matching
          # event that carries `created_at: null` (never observed from the
          # API) is readable but UNDATABLE, and an undatable event simply
          # contributes no anchor: c4 carries a timestamp, not an
          # existence claim, and a clock cannot be anchored to an event
          # with no time.
          #
          # c4 and c5 are IMMUTABLE, so they are resolved ONCE, outside the
          # wait loop — historical timeline events and the PR's creation
          # time cannot change while this run sleeps, and a long timeline
          # costs --paginate round-trips on every wake if read in-loop. The
          # one way a NEW review trigger can appear mid-sleep is a fresh
          # ready_for_review event, and that event's own run replaces this
          # one via the callers' cancel-in-progress concurrency groups, so
          # nothing is missed by not re-reading.
          #
          # c5 — the PR's creation time — anchors the `opened` trigger:
          # it is in the same review-lane `types:` list as ready_for_review,
          # so a branch whose commits idled before the PR was opened
          # NON-draft arrives with c1 pre-aged and would otherwise arm at
          # the instant the reviews start — wxa_vpn#1512's hole through a
          # different door. It comes from the event payload (no API read);
          # an empty value (defensive — every pull_request payload carries
          # created_at) simply contributes no anchor.
          timeline=$(retry gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/timeline?per_page=100" --paginate) || {
            echo "::error::could not read the PR timeline (the ready/reopen anchor) after retries — refusing to arm auto-merge (fail closed)."
            exit 1
          }
          c4=$(printf '%s' "$timeline" | jq -rs '[(add // [])[]
                | select(.event == "ready_for_review" or .event == "reopened")
                | .created_at] | max // empty') || {
            echo "::error::could not parse the PR timeline — refusing to arm auto-merge (fail closed)."
            exit 1
          }
          c5="${PR_CREATED_AT:-}"

          read_anchor() {
            local commits inline issue c1 c2 c3
            commits=$(retry gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits?per_page=100" --paginate) || return 1
            c1=$(printf '%s' "$commits" | jq -rs '[(add // [])[] | select((.parents | length) < 2) | .commit.committer.date] | max // empty') || return 1
            inline=$(retry gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments?per_page=100" --paginate) || return 1
            c2=$(printf '%s' "$inline" | jq -rs '[(add // [])[] | .created_at] | max // empty') || return 1
            issue=$(retry gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate) || return 1
            c3=$(printf '%s' "$issue" | jq -rs '[(add // [])[]
                  | select(((.user.login // "") | endswith("[bot]")))
                  | select(((.body // "") | test("<!-- (claude-author-automerge|pr-classify)")) | not)
                  | .created_at] | max // empty') || return 1
            printf '%s\n%s\n%s\n%s\n%s\n' "$c1" "$c2" "$c3" "$c4" "$c5" | grep -v '^$' | sort | tail -1
          }

          waited=0
          cap=$(( QUIET_S * 3 ))
          while :; do
            anchor=$(read_anchor) || {
              echo "::error::could not read the quiet-period anchors (commits/inline/issue comments) after retries — refusing to arm auto-merge (fail closed)."
              exit 1
            }
            # SHAPE, not just emptiness — an error body that leaks through
            # as "}" must not compare as a timestamp (same class the
            # findings checker pins on its last-commit read).
            case "$anchor" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T*) ;;
              *)
                echo "::error::quiet-period anchor is not an ISO-8601 timestamp (got: '${anchor:0:40}') — refusing to arm auto-merge (fail closed)."
                exit 1
                ;;
            esac
            age=$(( $(date -u +%s) - $(date -u -d "$anchor" +%s) ))
            remaining=$(( QUIET_S - age ))
            if [ "$remaining" -le 0 ]; then
              echo "Quiet: newest commit/review activity is ${age}s old (>= ${QUIET_S}s)."
              break
            fi
            if [ "$waited" -ge "$cap" ]; then
              echo "::notice::review activity kept arriving for ${waited}s (cap ${cap}s) — not arming from this run and disarming any stale arm; the next PR event retries."
              gh pr merge --disable-auto "$PR_URL" 2>&1 || true
              state=$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
              echo "Auto-merge state after quiet-cap revoke: $state"
              if [ "$state" = "ON" ]; then
                echo "::error::auto-merge still ON after --disable-auto — investigate"
                exit 1
              fi
              { echo "clear=0"; echo "reason=quiet-cap"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep_for=$remaining
            [ "$sleep_for" -gt "$QUIET_S" ] && sleep_for=$QUIET_S
            echo "Quiet period: newest activity ${age}s ago — sleeping ${sleep_for}s (waited ${waited}s, cap ${cap}s)."
            sleep "$sleep_for"
            waited=$(( waited + sleep_for ))
          done

          # CONSULT — fetched from this repo's default branch exactly like
          # classify.mjs: one detector, no drift between what the operator
          # CLI flags and what this gate declines on.
          work=$(mktemp -d)
          b64=$(retry gh api "repos/topcoder1/ci-workflows/contents/.github/scripts/unaddressed-findings.sh" --jq '.content') || {
            echo "::error::could not fetch unaddressed-findings.sh after retries — refusing to arm auto-merge (fail closed)."
            exit 1
          }
          printf '%s' "$b64" | base64 -d > "$work/unaddressed-findings.sh"
          chmod +x "$work/unaddressed-findings.sh"

          set +e
          report=$("$work/unaddressed-findings.sh" "${GITHUB_REPOSITORY}" "$PR" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$report"

          if [ "$rc" -eq 0 ]; then
            { echo "clear=1"; echo "reason=quiet+clean"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::unaddressed-findings check errored (rc=$rc) — refusing to arm auto-merge (fail closed)."
            exit 1
          fi

          # Findings present: never arm, and disarm any arm an earlier run
          # placed (same idempotent revoke as every other gate).
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          state=$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
          echo "Auto-merge state after findings revoke: $state"
          if [ "$state" = "ON" ]; then
            echo "::error::auto-merge still ON after --disable-auto — investigate"
            exit 1
          fi

          marker="<!-- claude-author-automerge:findings-gate -->"
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/$PR/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1 || true)
          {
            echo "$marker"
            echo "**Auto-merge withheld — review findings arrived after the last authored commit.**"
            echo ""
            echo "The quiet-period gate ran the unaddressed-findings check and it flagged:"
            echo ""
            echo '```'
            printf '%s\n' "$report" | head -40
            echo '```'
            echo ""
            echo "- Push a commit addressing them — the push re-runs this gate and re-arms"
            echo "  automatically when the check comes back clean."
            echo "- If a finding is wrong, merge manually — this gate only withholds the"
            echo "  automatic arm; it never blocks the merge button and is not a required check."
          } > /tmp/automerge-findings.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/$existing" \
              -f body="$(cat /tmp/automerge-findings.md)" >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/automerge-findings.md
          fi
          { echo "clear=0"; echo "reason=findings"; } >> "$GITHUB_OUTPUT"
          echo "::notice::Auto-merge withheld: unaddressed review findings (see the sticky comment). Manual merge remains available."
          exit 0

      - name: Enable auto-merge
        id: arm
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          steps.hold.outputs.hold != '1' &&
          steps.base_gate.outputs.refuse != '1' &&
          steps.quiet_findings.outputs.clear == '1' && (
            steps.risk.outputs.risky != '1' ||
            steps.bypass_label.outputs.bypass == '1' ||
            steps.bypass_codex.outputs.bypass == '1'
          )
        env:
          # Prefer the caller-supplied PAT so the merge commit triggers
          # downstream `push:` workflows (deploy, CI). Fall back to the
          # workflow-issued GITHUB_TOKEN when no PAT is wired — auto-merge
          # still works but downstream workflows are silenced. See the
          # `automerge_pat` secret docstring above for the full rationale.
          GH_TOKEN: ${{ secrets.automerge_pat || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METHOD: ${{ inputs.merge_method }}
          REASON: ${{ steps.detect.outputs.reason }}
          RISKY: ${{ steps.risk.outputs.risky }}
          BYPASS_LABEL: ${{ steps.bypass_label.outputs.bypass }}
          BYPASS_CODEX: ${{ steps.bypass_codex.outputs.bypass }}
          USING_PAT: ${{ secrets.automerge_pat != '' && '1' || '0' }}
          GATE_BASE_REF: ${{ steps.base_gate.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPTIN_LABEL: ${{ inputs.nonmain_base_optin_label }}
        run: |
          set -euo pipefail
          # Re-bind the base-gate verdict to live state immediately before
          # arming. `--match-head-commit` below binds the arm to the head
          # SHA, but the BASE and the opt-in LABEL both mutate WITHOUT moving
          # that SHA — so a run that cleared the gate, followed by a retarget
          # onto an unprotected branch (or removal of the opt-in label),
          # would arm against routing nothing ever validated and, with no
          # required checks on that base, merge instantly. Refusing on ANY
          # change is stricter than re-running the base rules and needs no
          # second open-PR listing: the retarget's own event re-gates from
          # scratch.
          #
          # Every rejection below DISARMS before exiting. Declining to call
          # `gh pr merge --auto` is not enough when an earlier run already
          # armed this PR: the base-gate refusal-revoke did not fire (that
          # run's gate passed) and the always() error-revoke does not fire
          # either when this step exits 0. Without the disarm, the change
          # would be detected and then ignored, the stale arm merging anyway.
          disarm_then_exit() {
            gh pr merge --disable-auto "$PR_URL" 2>&1 || true
            state=$(gh pr view "$PR_URL" --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "OFF" else "ON" end' 2>/dev/null || echo "UNKNOWN")
            echo "Auto-merge state after pre-arm revalidation revoke: $state"
            if [ "$state" != "OFF" ]; then
              echo "::error::auto-merge is '$state' after --disable-auto — investigate"
              exit 1
            fi
            # A deliberate stand-down (exit 0) ends this run green with no
            # arm and, because retargets emit only `edited` (no caller
            # subscribes), no later event on its own — exactly the wedge
            # signature. Publish it for the decision-label reconciler so
            # the PR carries `automerge:refused-base` instead of silence.
            # Only on the clean path: a failed disarm exits 1 above and
            # must stay an unlabeled red run.
            if [ "$1" = "0" ]; then
              echo "stood_down=base" >> "$GITHUB_OUTPUT"
            fi
            exit "$1"
          }
          now_base=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .base.ref) || {
            echo "::error::could not re-read the base ref before arming — refusing to arm (fail closed)."
            disarm_then_exit 1
          }
          # NOTE — do NOT "fix" this into an ownership guard that skips the
          # disarm when the base moved (proposed as a stale-run concern in
          # review). That reasoning assumes a retarget starts a newer run
          # which owns the decision. It does not: a base change emits
          # `pull_request: edited`, and no caller subscribes to `edited`
          # (types are opened/synchronize/reopened/ready_for_review/labeled).
          # So a retarget fires NOTHING, and skipping the disarm would leave
          # an arm validated against the OLD base live on the new one — with
          # no required checks there, it merges immediately. That is the
          # incident, rebuilt. Disarming can strand a PR until its next event
          # (or a human click); that cost is bounded, visible, and recoverable,
          # and an unreviewed merge is none of those.
          if [ "$now_base" != "$GATE_BASE_REF" ]; then
            echo "::notice::base changed ('$GATE_BASE_REF' → '$now_base') since this run's gate read — not arming, and disarming: no event fires on a retarget, so an arm validated against '$GATE_BASE_REF' must not survive onto '$now_base'."
            disarm_then_exit 0
          fi
          if [ "$now_base" != "$DEFAULT_BRANCH" ]; then
            # Re-list open heads. Opening the PARENT PR fires NO event for
            # this child, so nothing would re-gate it: a parent opened
            # between this run's gate read and here would let the child merge
            # into a branch that is now itself under review — precisely the
            # #1027 shape, reassembled from the other side.
            now_heads=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --paginate --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .head.ref') || {
              echo "::error::could not re-list open PRs before arming a non-default base — refusing to arm (fail closed)."
              disarm_then_exit 1
            }
            if grep -qxF "$now_base" <<<"$now_heads"; then
              echo "::notice::base '$now_base' became the head branch of an open PR since this run's gate read — not arming."
              disarm_then_exit 0
            fi
            if [ -n "$OPTIN_LABEL" ]; then
              optin=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels?per_page=100" \
                --paginate --jq '.[].name') || {
                echo "::error::could not re-read labels before arming a non-default base — refusing to arm (fail closed)."
                disarm_then_exit 1
              }
              if ! grep -qxF "$OPTIN_LABEL" <<<"$optin"; then
                echo "::notice::'$OPTIN_LABEL' is no longer present and the base is not the default branch — not arming."
                disarm_then_exit 0
              fi
            fi
          fi
          if [ "$BYPASS_LABEL" = "1" ]; then
            echo "Enabling auto-merge ($METHOD) — detection: $REASON; risk bypassed via approval label"
          elif [ "$BYPASS_CODEX" = "1" ]; then
            echo "Enabling auto-merge ($METHOD) — detection: $REASON; risk bypassed via Codex pass"
          else
            echo "Enabling auto-merge ($METHOD) — detection: $REASON"
          fi
          if [ "$USING_PAT" = "1" ]; then
            echo "Auth: caller-supplied automerge_pat — downstream workflows WILL trigger on merge."
          else
            echo "::warning::Auth: GITHUB_TOKEN fallback — downstream push workflows (e.g. deploy) will be SILENCED on merge. Wire secrets.automerge_pat in the caller to fix."
          fi
          # Bind the arm to the exact revision this run's gates evaluated
          # (codex round-2 P1). --match-head-commit maps to GraphQL
          # enablePullRequestAutoMerge.expectedHeadOid: GitHub rejects the
          # arm atomically if the head moved between this event and now, so
          # a push that lands mid-run can never inherit an arm decided on
          # older files — its own synchronize run re-classifies and arms.
          # Deliberately NO revoke in the head-moved path below: this run's
          # knowledge is stale, and a revoke here can land AFTER the newer
          # head's own run validly armed — disarming a clean PR and
          # stranding it until the next event (rapid fixup pushes make that
          # ordering common). Residual, unchanged by this workflow: once
          # armed, GitHub keeps auto-merge across later pushes; a blocked
          # post-arm push is revoked by its own synchronize run (~1 min
          # from push), which loses only if EVERY required check on the new
          # head completes faster — not a real shape in this fleet, where
          # Claude Review (minutes) is the universal required check.
          if ! gh pr merge --auto --"$METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || echo "")
            if [ -n "$now" ] && [ "$now" != "$HEAD_SHA" ]; then
              echo "::notice::head moved (${HEAD_SHA} → ${now}) between this event and arming — not arming from this run; the newer push's own run re-classifies and (re)arms."
              exit 0
            fi
            echo "::error::enable auto-merge failed and the head still matches ${HEAD_SHA} — investigate."
            exit 1
          fi
          # Published for the decision-label reconciler below: `armed=1`
          # means THIS run enabled auto-merge, so any stale `automerge:*`
          # abstention label must come off. The head-moved stand-down above
          # exits before this line — that run owns no decision and must not
          # touch the newer head's labels.
          echo "armed=1" >> "$GITHUB_OUTPUT"

      # Sticky comment when classifier marked the PR risk:blocked. Distinct
      # from the regex-based comment below — classifier-blocked has no
      # bypass mechanism (it's a hard policy block), so the message
      # shouldn't dangle bypass options the user can't actually use.
      - name: Comment when classifier-blocked
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.classifier_verdict.outputs.verdict_label }}
          VERDICT_SOURCE: ${{ steps.classifier_verdict.outputs.verdict_source }}
        run: |
          set -euo pipefail
          marker="<!-- claude-author-automerge:classifier-blocked -->"
          existing=$(gh api "/repos/${{ github.repository }}/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          {
            echo "$marker"
            if [ "$VERDICT_SOURCE" = "risk-paths" ]; then
              echo "**Auto-merge refused — \`${VERDICT:-risk:blocked}\`: changed files match the base branch's \`.github/risk-paths.yml\` (evaluated directly by the auto-merge gate — no label round-trip).**"
            else
              echo "**Auto-merge refused — \`${VERDICT:-risk:blocked}\` label set by pr-classify.**"
            fi
            echo ""
            if [ "$VERDICT" = "risk:sensitive" ]; then
              echo "This PR touches a path in \`.github/risk-paths.yml\`'s \`sensitive:\` list"
              echo "(e.g. agent runtime, schema, migrations). Per the risk taxonomy,"
              echo "sensitive-class PRs are reviewed (Claude + Adversarial + Codex) and then"
              echo "**human click-merged** — auto-merge does not apply. The reusable's global"
              echo "risk-tier regex can't see a caller's repo-specific \`sensitive:\` paths, so"
              echo "the \`risk:sensitive\` verdict (computed from the base branch's risk file,"
              echo "with the pr-classify label as a second signal) is what gates these."
              echo ""
              echo "If this is misclassified, edit the caller repo's \`.github/risk-paths.yml\`."
            else
              echo "This PR touches a path category in \`.github/risk-paths.yml\`'s \`blocked:\`"
              echo "list (workflows, classifier config, CODEOWNERS, secrets, infra). Per the"
              echo "global CLAUDE.md policy, blocked-class PRs require admin click-merge — no"
              echo "label or status-check bypass applies."
              echo ""
              echo "If this is misclassified, edit the caller repo's \`.github/risk-paths.yml\`."
            fi
          } > /tmp/automerge-blocked.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "/repos/${{ github.repository }}/issues/comments/$existing" \
              -f body="$(cat /tmp/automerge-blocked.md)" >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/automerge-blocked.md
          fi

      - name: Comment + skip when risky
        if: |
          steps.detect.outputs.claude_authored == '1' &&
          steps.classifier_verdict.outputs.blocked != '1' &&
          steps.hold.outputs.hold != '1' &&
          steps.risk.outputs.risky == '1' &&
          steps.bypass_label.outputs.bypass != '1' && steps.bypass_codex.outputs.bypass != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MATCHED: ${{ steps.risk.outputs.matched }}
          BYPASS_LABEL: ${{ inputs.risk_bypass_label }}
          CODEX_CHECK: ${{ inputs.codex_check_name }}
          CODEX_STATE: ${{ steps.bypass_codex.outputs.state }}
        run: |
          set -euo pipefail
          marker="<!-- claude-author-automerge:risk-tier -->"
          existing=$(gh api "/repos/${{ github.repository }}/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          {
            echo "$marker"
            echo "**Auto-merge blocked — risk-tier paths touched.**"
            echo ""
            echo "This Claude-authored PR modifies files matching the risk-tier patterns"
            echo "defined in the global CLAUDE.md policy (auth / secrets / migrations /"
            echo "billing / production infra). Manual click-merge required, OR use one of"
            echo "the bypass paths below."
            echo ""
            echo "Matched files:"
            echo '```'
            printf "%b" "$MATCHED"
            echo '```'
            echo ""
            echo "**Bypass options (no PR detail navigation needed):**"
            echo ""
            if [ -n "$BYPASS_LABEL" ]; then
              echo "- Apply the \`$BYPASS_LABEL\` label to this PR. The workflow will re-run on"
              echo "  the label event and enable auto-merge. One click from the PR list page."
            fi
            if [ -n "$CODEX_CHECK" ]; then
              echo "- Codex-trusted bypass: a SUCCESS from the \`$CODEX_CHECK\` check lets a"
              echo "  LATER run of this workflow arm auto-merge — but a check completing fires"
              echo "  no run by itself, and bot label writes fire nothing (GITHUB_TOKEN events"
              echo "  never trigger workflows). Re-fire this workflow by pushing a commit or by"
              echo "  re-applying a label as a human. Observed \`$CODEX_CHECK\` state at this"
              echo "  run's decision time: \`${CODEX_STATE:-absent}\`. Repos that deliberately"
              echo "  route standard-tier PRs to a differently named Codex check (e.g."
              echo "  \`review_standard / Codex Review\`) keep this bypass unavailable there by"
              echo "  design — use the bypass label above, or click-merge."
            fi
            echo ""
            echo "If a path is misclassified, fix the regex in"
            echo "\`topcoder1/ci-workflows/.github/workflows/claude-author-automerge.yml\`."
          } > /tmp/automerge-comment.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "/repos/${{ github.repository }}/issues/comments/$existing" \
              -f body="$(cat /tmp/automerge-comment.md)" >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/automerge-comment.md
          fi

      # Arbiter decision label (wxa-graph#476/#478, 2026-08-28): every
      # deliberate abstention above ends with a GREEN run and
      # autoMergeRequest=null — at the surface operators actually probe
      # (`gh pr view --json labels,autoMergeRequest`, the PR list) that is
      # INDISTINGUISHABLE from the cancel-in-progress wedge where no run
      # consumed the state at all. Both #476 (findings hold) and #478
      # (risk-tier match) were diagnosed as wedges and label-refired /
      # manually merged while the real decision sat in a sticky comment
      # and a green log's ::notice. This step publishes the standing
      # decision as exactly one `automerge:*` label so absence-of-arm
      # always carries its reason.
      #
      # Design constraints, in order:
      #   * NOT a check-run or commit status — that needs checks:/statuses:
      #     write, and the reusable's job permissions are capped by 44+
      #     existing callers granting only contents+pull-requests (the
      #     Option-B cap-mismatch note on the job header). Labels ride the
      #     pull-requests:write the fleet already grants.
      #   * GITHUB_TOKEN label writes never trigger workflows (recursion
      #     prevention), so publishing is inert — no self-retrigger, no
      #     safe-paths cross-fire.
      #   * The reconciler manages ONLY the exact prefix `automerge:` —
      #     `auto-merge`, `auto-merge-approved`, `auto-merge-nonmain`,
      #     `manual-merge` and `risk:*` are other mechanisms' surfaces and
      #     are never touched.
      #   * Advisory, never load-bearing: every label API failure degrades
      #     to a ::warning and exit 0. The gate decisions above already
      #     stand on their own; a label blip must not redden a run that
      #     decided correctly (and gh-retry double-fire is a known trap —
      #     one attempt, non-fatal).
      #   * ARMED / hold runs reconcile to NO label: those states are
      #     already visible (autoMergeRequest; the hold label is the
      #     operator's own click, present by definition). Classifier-
      #     blocked PUBLISHES `automerge:blocked-classifier` — the verdict
      #     can come from the direct risk-paths.yml read with no risk:*
      #     label on the PR at all, and the operator contract below only
      #     holds if every abstention labels. A run with no positive
      #     terminal state of its own (arm stood down on a moved head, a
      #     gate step errored) publishes NOTHING — the newer head's run or
      #     the red job owns the story, and clearing here could race a
      #     valid newer decision. Two guards enforce ownership: the step
      #     skips on run cancellation (`!cancelled()` — a superseded run's
      #     stale gate outputs must not repaint labels; the status
      #     function still lets it run after a FAILED step, where it
      #     no-ops via publish=0), and it re-reads the live head before
      #     mutating, standing down on any mismatch or unreadable head.
      #   * SNAPSHOT semantics, accepted: the label records the LAST run's
      #     verdict. PR state that mutates with NO event — the canonical
      #     case is a post-run base retarget, which emits only `edited`
      #     (unsubscribed) — leaves the label stale until the next event's
      #     run reconciles it. That is deliberate: no publish-time probe
      #     can see a future retarget, and a stale label's remedy line
      #     ("re-fire with an event, or click-merge") is still the correct
      #     operator move, unlike the unlabeled green+null wedge signature
      #     it replaces (codex round-2, accepted with reworded remedy).
      - name: Publish arbiter decision label
        id: decision_label
        if: |
          !cancelled() &&
          steps.detect.outputs.claude_authored == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARMED: ${{ steps.arm.outputs.armed }}
          ARM_STOOD_DOWN: ${{ steps.arm.outputs.stood_down }}
          BLOCKED: ${{ steps.classifier_verdict.outputs.blocked }}
          HOLD: ${{ steps.hold.outputs.hold }}
          BASE_REFUSE: ${{ steps.base_gate.outputs.refuse }}
          RISKY: ${{ steps.risk.outputs.risky }}
          BYPASS_LBL: ${{ steps.bypass_label.outputs.bypass }}
          BYPASS_CDX: ${{ steps.bypass_codex.outputs.bypass }}
          QF_REASON: ${{ steps.quiet_findings.outputs.reason }}
        run: |
          set -euo pipefail
          # Terminal-state precedence mirrors the gate chain above. `publish=0`
          # (no state this run owns) is distinct from `decision=""` (positive
          # state, natively visible — clear stale arbiter labels).
          decision=""
          publish=1
          if [ "${ARMED:-}" = "1" ] || [ "${HOLD:-}" = "1" ]; then
            decision=""
          elif [ "${BLOCKED:-}" = "1" ]; then
            # Publishes rather than defers to the risk:* label: the verdict
            # can come from the DIRECT risk-paths.yml read with no label on
            # the PR at all (pr-classify absent, lagging, or its label write
            # failed) — and the operator contract "no automerge:* label =
            # wedge" only holds if EVERY abstention labels (codex round-3).
            decision="automerge:blocked-classifier"
          elif [ "${ARM_STOOD_DOWN:-}" = "base" ] || [ "${BASE_REFUSE:-}" = "1" ]; then
            decision="automerge:refused-base"
          elif [ "${RISKY:-}" = "1" ] && [ "${BYPASS_LBL:-}" != "1" ] && [ "${BYPASS_CDX:-}" != "1" ]; then
            decision="automerge:blocked-risk-tier"
          elif [ "${QF_REASON:-}" = "findings" ]; then
            decision="automerge:withheld-findings"
          elif [ "${QF_REASON:-}" = "quiet-cap" ]; then
            decision="automerge:withheld-quiet-cap"
          else
            publish=0
          fi
          if [ "$publish" = "0" ]; then
            echo "No arbiter decision to publish from this run — labels untouched."
            exit 0
          fi
          # Ownership probe: only the run whose event matches the PR's LIVE
          # head may repaint labels — a superseded run's decision is stale
          # by definition (same guard as the error-revoke step below). A
          # positive mismatch or an unreadable head both stand down:
          # advisory surface fails toward silence, never a stale repaint.
          live=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null) || live=""
          if [ -z "$live" ]; then
            echo "::warning::could not read the live head — skipping arbiter decision-label publish (advisory)."
            exit 0
          fi
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "Head moved (${HEAD_SHA} → ${live}) — the newer head's run owns the labels; not publishing."
            exit 0
          fi
          # Paginated read — a hold label past the 30-label default page must
          # not read as absent (same pin as the manual-hold gate).
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels?per_page=100" \
            --paginate --jq '.[].name' 2>/dev/null) || {
            echo "::warning::could not read PR labels — skipping arbiter decision-label publish (advisory; the gate decision above already stands)."
            exit 0
          }
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            case "$l" in
              automerge:*) ;;
              *) continue ;;
            esac
            [ "$l" = "$decision" ] && continue
            enc=$(jq -rn --arg s "$l" '$s|@uri')
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/${enc}" >/dev/null 2>&1 \
              || echo "::warning::could not remove stale arbiter label '$l' (non-fatal)."
          done <<< "$current"
          if [ -z "$decision" ]; then
            echo "Arbiter labels cleared — state is natively visible (armed / risk:* / hold label)."
            exit 0
          fi
          # Deliberately BEFORE the create/edit ensure: a same-verdict rerun
          # is the common case (every synchronize/labeled event), and paying
          # two label-API calls each time to refresh a description that is
          # merely cosmetically stale is not worth the churn — wording
          # refreshes ride the next publish that actually ADDS the label
          # anywhere in the repo (codex round-4 P3, accepted).
          if grep -qxF "$decision" <<< "$current"; then
            echo "Arbiter decision label '$decision' already present."
            exit 0
          fi
          case "$decision" in
            automerge:blocked-classifier) color="a40e26"; desc="Automerge arbiter: risk:blocked/sensitive classifier verdict — manual click-merge per risk tier" ;;
            automerge:blocked-risk-tier)  color="b60205"; desc="Automerge arbiter: risk-tier path matched — click-merge or apply the bypass label" ;;
            automerge:withheld-findings)  color="d93f0b"; desc="Automerge arbiter: review findings postdate the last commit — push a fix or merge manually" ;;
            automerge:withheld-quiet-cap) color="fbca04"; desc="Automerge arbiter: review activity never went quiet — the next PR event retries" ;;
            automerge:refused-base)       color="5319e7"; desc="Automerge arbiter: stood down on base-branch state — re-fire with a push/label event or click-merge" ;;
          esac
          # create-else-EDIT (not a create-retry): create's failure is the
          # EXPECTED already-exists conflict, and the edit refreshes a
          # stale description on repos that minted the label under older
          # wording (codex round-3 P3). Both non-fatal — a real failure
          # (perms, outage) surfaces at the add below, whose warning is
          # the reporting surface.
          gh label create "$decision" --color "$color" --description "$desc" 2>/dev/null \
            || gh label edit "$decision" --color "$color" --description "$desc" >/dev/null 2>&1 || true
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" -f "labels[]=$decision" >/dev/null; then
            echo "Published arbiter decision label: $decision"
          else
            echo "::warning::could not add arbiter decision label '$decision' (non-fatal — the run log and sticky comment carry the decision)."
          fi

      # FAIL CLOSED for already-armed PRs (codex round-4 P1): "refusing
      # to arm" is not enough when a previous run already armed. If a
      # gating step ERRORED (rules unreadable after retries, label read
      # failed, hold signals — label or timeline — unreadable after
      # retries, classifier enum violation, 3000-file listing cap), this
      # run cannot know the PR is safe — and without this step the job
      # would just go red while the stale arm survives and merges once
      # checks pass. Runs last, under always(), because a failed step
      # otherwise skips everything after it; outcome == 'failure'
      # distinguishes a genuine error from skipped (non-Claude PRs,
      # blocked short-circuits). The job still ends red from the failed
      # gate step — this only guarantees the arm is gone.
      #
      # PREREQUISITE failures count too (codex round-5 P1): if checkout,
      # detect, or setup-node errors, the gate steps end 'skipped' — not
      # 'failure' — and the arm would survive on the outcome checks
      # alone. Checkout/detect failure also means authorship was never
      # detected, so the guard falls back to the payload-level claude/*
      # branch prefix (the fleet's dominant Claude-PR shape; a
      # trailer-only Claude PR with a failed checkout stays uncovered —
      # accepted residual). This step needs no workspace, so it runs
      # fine even when checkout itself failed.
      - name: Revoke auto-merge if gates errored
        if: |
          always() &&
          (steps.detect.outputs.claude_authored == '1' ||
           (steps.detect.outcome != 'success' &&
            startsWith(github.event.pull_request.head.ref, 'claude/'))) &&
          (steps.classifier_verdict.outcome == 'failure' ||
           steps.hold.outcome == 'failure' ||
           steps.base_gate.outcome == 'failure' ||
           steps.risk.outcome == 'failure' ||
           steps.quiet_findings.outcome == 'failure' ||
           steps.setup_node.outcome == 'failure' ||
           steps.checkout.outcome == 'failure' ||
           steps.detect.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Ownership guard (codex round-6 P2): if the head moved since
          # this run's event, the newer head's own run owns the arm
          # decision — an unconditional revoke here could land AFTER that
          # run validly armed, disarming a clean PR with no event left to
          # re-arm it. Skip only on a POSITIVE head-moved read; if the
          # read itself fails, revoke anyway (fail toward safety — the
          # rare stale disarm self-heals on the next event).
          now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || echo "")
          if [ -n "$now" ] && [ "$now" != "$HEAD_SHA" ]; then
            echo "::notice::head moved (${HEAD_SHA} → ${now}) since this event — the newer head's run owns gating; skipping stale revoke."
            exit 0
          fi
          echo "A gating step errored — revoking any existing auto-merge arm (fail closed for already-armed PRs)."
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          state=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "OFF" else "ON" end')
          echo "Auto-merge state after error revoke: $state"
          if [ "$state" = "ON" ]; then
            echo "::error::auto-merge still ON after --disable-auto — investigate"
            exit 1
          fi
