name: Regression Convention

# Two roles for this workflow:
#
# 1. Self-test: triggers on pull_request + push to main of *this repo*. Wired
#    with `lessons_files: ""` (no Lessons section tracked in this repo); the
#    workflow no-ops gracefully. Synthetic FAIL-path testing happens during
#    Phase 3 install on dotclaude (which DOES have a `## Lessons` section).
#
# 2. Reusable: callers do
#       jobs:
#         regression-convention:
#           uses: topcoder1/ci-workflows/.github/workflows/regression-convention.yml@main
#           with:
#             lessons_files: "MEMORY.md,CLAUDE.md"  # whichever holds `## Lessons`
#    See callers/regression-convention.yml for the installer-generated caller.
#
# What it does:
#   - For each path in `lessons_files`, extract the `## Lessons` section
#     (from `^## Lessons` to the next `^## ` or EOF) in BOTH base and head.
#     If they differ, the PR modified the Lessons section.
#   - If ANY configured lessons file's Lessons section changed AND the PR
#     did NOT add or modify a file under `regression_dir` (default
#     `tests/regression/`), FAIL with a clear message.
#   - Empty `lessons_files` → no-op (no Lessons section tracked yet).
#   - Deletions of Lessons bullets are NOT a violation (pruning is fine);
#     only additions/modifications count. (Implementation: compare hashes of
#     the *additive* changes — simplest: any inequality in section content
#     triggers the check, but the message hints at "add a test OR remove
#     the lesson edit" so deletions are explicitly fine.)
#
# Why the per-repo config (no default lessons file): the fleet convention is
# split. Global CLAUDE.md says "append to MEMORY.md", but `wxa_vpn` keeps
# lessons in CLAUDE.md, `wxa-jake-ai` has both, several repos have neither
# file with Lessons. A single default would either fire on a file most repos
# don't use or miss the file they do. The installer (Phase 2 Task 2.4)
# auto-detects per repo and wires the explicit path(s) into the caller.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      lessons_files:
        description: "REQUIRED for callers. Comma-separated list of paths to files holding `## Lessons` (e.g. 'MEMORY.md,CLAUDE.md'). Empty string = no-op (workflow installs but doesn't fire until a Lessons section is added). The installer auto-detects per-repo and writes the resolved path(s) here."
        required: false
        type: string
        default: ""
      lessons_section_header:
        description: "Markdown header line that begins the lessons section. Default '## Lessons'."
        required: false
        type: string
        default: "## Lessons"
      regression_dir:
        description: "Directory that must contain a new/modified file when the lessons section changes. Default 'tests/regression'."
        required: false
        type: string
        default: "tests/regression"
      max_test_backed_bullet_chars:
        description: "Once a lessons bullet cites a paired test, the test is what prevents recurrence and the prose is a second copy — so cap the bullet and keep the narrative in the archive. Applies ONLY to bullets this PR adds or edits that carry a `Test:`/`Tests:` citation; untouched bullets and uncited ones are never gated, so a repo can adopt this without first fixing its backlog. 0 (default) disables the gate entirely — callers opt in."
        required: false
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Lessons must have tests
    runs-on: ubuntu-latest
    # Only meaningful on pull_request events; push events to main run as a
    # no-op (no diff to enforce against).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve base + head refs
        id: refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          # Use merge-base, not base tip, so we only see what THIS PR changed —
          # not what main happened to add since the branch forked. Two-dot diff
          # against the moving base tip false-positives on stale-base PRs
          # whenever main lands a Lessons edit in the interim (dotclaude#90).
          BASE_TIP=$(git rev-parse "origin/$BASE_REF")
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git merge-base "$BASE_TIP" "$HEAD_SHA")
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_tip=$BASE_TIP merge_base=$BASE_SHA head=$HEAD_SHA"

      - name: Check lessons-vs-regression-tests contract
        env:
          LESSONS_FILES_RAW: ${{ inputs.lessons_files || '' }}
          LESSONS_HEADER: ${{ inputs.lessons_section_header || '## Lessons' }}
          REGRESSION_DIR: ${{ inputs.regression_dir || 'tests/regression' }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Skip for bot-authored PRs — bots can't add paired regression tests.
          # Covers: github-actions[bot], dependabot[bot], renovate[bot], etc.
          # Also skip for the coverage-floor seed branch: it diffs against a
          # potentially-stale base, which can make CLAUDE.md Lessons bullets
          # appear removed then re-added as a false-positive diff.
          #
          # `PR_AUTHOR` is who OPENED the PR and never changes afterwards, but
          # anyone with push access can add commits to a bot's branch. Gating
          # on it alone lets a human land a Lessons bullet with no paired test
          # by pushing onto any dependabot branch — this is a REQUIRED check on
          # the fleet's main rulesets, so skipping it is the whole enforcement.
          # Same defect that let whois-api-llc/wxa-jake-ai#1064 inherit a green
          # `review / Claude Review` from its opener; see claude-review.yml in
          # this repo for the full incident note.
          #
          # So the premise has to be checked, not assumed: skip only when every
          # commit in the PR range really is bot-authored. Unlike claude-review
          # this reads git rather than the API — the checkout above is
          # `fetch-depth: 0` at the PR head, so the full range is already local.
          # That avoids both the 250-commit API cap and a network failure mode.
          #
          # Committer as well as author: `--amend` and rebase PRESERVE the
          # original author and rewrite only the committer, so author alone
          # would still hand an amended dependabot commit the skip. `GitHub` is
          # the committer name on commits GitHub creates server-side, which is
          # what a genuine bump looks like (author dependabot[bot], committer
          # GitHub) — requiring a [bot] committer alone would reject every one.
          #
          # Deliberately weaker than claude-review.yml, which additionally
          # requires the GitHub signature to verify. That needs the API, and
          # the trade is not worth it here: this check gates a
          # lessons-vs-tests convention rather than code review, and adding a
          # network call would put a new failure mode inside a required check.
          if [[ "$PR_AUTHOR" == *"[bot]" ]]; then
            NON_BOT_COMMITS=$(git log --format='%an|%cn' "${BASE_SHA}..${HEAD_SHA}" \
              | awk -F'|' '
                  NF == 0 { next }
                  $1 ~ /\[bot\]$/ && ($2 ~ /\[bot\]$/ || $2 == "GitHub") { next }
                  { n++ }
                  END { print n + 0 }
                ')
            if [[ "$NON_BOT_COMMITS" -eq 0 ]]; then
              echo "skipping convention check: bot-authored PR (${PR_AUTHOR}) — bots can't add paired regression tests"
              exit 0
            fi
            echo "PR opened by ${PR_AUTHOR} but carries ${NON_BOT_COMMITS} non-bot commit(s) — enforcing the convention check"
          fi
          if [[ "$PR_HEAD_BRANCH" == chore/coverage-floor-seed* ]]; then
            echo "skipping convention check: coverage-floor seed branch (${PR_HEAD_BRANCH}) — stale-base diffs are expected"
            exit 0
          fi

          if [[ -z "$LESSONS_FILES_RAW" ]]; then
            echo "lessons_files is empty — no Lessons section tracked in this repo. Skipping."
            exit 0
          fi

          # Extract the section from `^${header}` to the next `^## ` or EOF.
          extract_section() {
            local content="$1"
            local header="$2"
            awk -v h="$header" '
              $0 == h { p = 1; next }
              /^## / { if (p) exit }
              p { print }
            ' <<<"$content"
          }

          IFS=, read -ra FILES <<<"$LESSONS_FILES_RAW"
          LESSONS_CHANGED_IN=()
          for raw_path in "${FILES[@]}"; do
            # Trim whitespace around comma-split entries.
            path=$(echo "$raw_path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$path" ]] && continue

            # `git show <sha>:<path>` errors if file doesn't exist at that sha.
            # Treat "not present at base" as empty (new file = additive change).
            BASE_CONTENT=$(git show "$BASE_SHA:$path" 2>/dev/null || echo "")
            HEAD_CONTENT=$(git show "$HEAD_SHA:$path" 2>/dev/null || echo "")

            BASE_SECTION=$(extract_section "$BASE_CONTENT" "$LESSONS_HEADER")
            HEAD_SECTION=$(extract_section "$HEAD_CONTENT" "$LESSONS_HEADER")

            if [[ "$BASE_SECTION" != "$HEAD_SECTION" ]]; then
              LESSONS_CHANGED_IN+=("$path")
              echo "lessons section changed in: $path"
            fi
          done

          if [[ ${#LESSONS_CHANGED_IN[@]} -eq 0 ]]; then
            echo "PASS: no lessons-section changes detected in [${LESSONS_FILES_RAW}]"
            exit 0
          fi

          # Lessons changed. Now check whether a regression test was added or
          # modified under $REGRESSION_DIR.
          CHANGED_TEST_FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA..$HEAD_SHA" -- "$REGRESSION_DIR/" || true)

          if [[ -n "$CHANGED_TEST_FILES" ]]; then
            echo "PASS: lessons changed in [${LESSONS_CHANGED_IN[*]}], and PR adds/modifies regression test(s):"
            echo "$CHANGED_TEST_FILES" | sed 's/^/  /'
            exit 0
          fi

          # FAIL.
          {
            echo "::error::PR modifies '${LESSONS_HEADER}' in [${LESSONS_CHANGED_IN[*]}] but does NOT add or modify a file under ${REGRESSION_DIR}/."
            echo "::error::Either:"
            echo "::error::  (a) add a regression test in ${REGRESSION_DIR}/ that would have caught the bug the lesson is about, or"
            echo "::error::  (b) remove the lesson edit from this PR and ship it separately with the test."
            echo "::error::Pure deletions/prunings of lessons bullets are fine — but this PR adds or modifies bullet content."
          }
          exit 1

      # ---------------------------------------------------------------------
      # Second gate: cap bullets that already have a paired test.
      #
      # Why this exists. The lessons file grows monotonically and every fixed
      # budget eventually forces a loss. Measured on topcoder1/dotclaude: a
      # manual compression cut it 71,436B -> 40,951B in 2026-07 (its `##
      # Lessons` section 20,217B -> 6,200B), and within two months that section
      # had regrown 29% to 8,013B — ~900B/month — while `## Process notes`
      # stayed flat (14,577 -> 14,108B). So the growth is one section, and a
      # hand-run compression cycle demonstrably does not hold. Discipline
      # decayed; only a gate survives.
      #
      # Why THESE bullets. The two sections have opposite enforcement models.
      # A `## Lessons` bullet is required to cite a paired regression test (the
      # gate above), and that test is what actually prevents recurrence — CI
      # fails whether or not the prose is in anyone's context. Process notes
      # are exempt from the test requirement by design, so for them prose IS
      # the only enforcement and must stay. Capping test-backed bullets
      # therefore removes a second copy, not a control.
      #
      # Scope, deliberately narrow:
      #   * only bullets this PR ADDS or EDITS (verbatim-unchanged lines are
      #     skipped), so adopting the gate does not require fixing a backlog
      #     first and no PR is failed by text it did not touch;
      #   * only bullets carrying a `Test:`/`Tests:` citation;
      #   * disabled unless the caller passes a non-zero cap.
      #
      # Known limitation, stated rather than papered over: a cited test may
      # live in ANOTHER repo (`techrecon internal/store/..._test.go`), which
      # this job cannot see. Verifying that would mean cross-repo API calls
      # inside a lint gate — a network failure mode and a token scope for no
      # real gain — so the citation is taken at face value. The pairing gate
      # above is what makes a citation mean something.
      - name: Cap test-backed lessons bullets
        if: ${{ inputs.max_test_backed_bullet_chars && inputs.max_test_backed_bullet_chars > 0 }}
        env:
          LESSONS_FILES_RAW: ${{ inputs.lessons_files || '' }}
          LESSONS_HEADER: ${{ inputs.lessons_section_header || '## Lessons' }}
          MAX_CHARS: ${{ inputs.max_test_backed_bullet_chars }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$LESSONS_FILES_RAW" ]]; then
            echo "lessons_files is empty — nothing to cap. Skipping."
            exit 0
          fi
          extract_section() {
            awk -v h="$2" '
              $0 == h { p = 1; next }
              /^## / { if (p) exit }
              p { print }
            ' <<<"$1"
          }
          VIOLATIONS=0
          IFS=, read -ra FILES <<<"$LESSONS_FILES_RAW"
          for raw_path in "${FILES[@]}"; do
            path=$(echo "$raw_path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$path" ]] && continue
            BASE_SECTION=$(extract_section "$(git show "$BASE_SHA:$path" 2>/dev/null || echo "")" "$LESSONS_HEADER")
            HEAD_SECTION=$(extract_section "$(git show "$HEAD_SHA:$path" 2>/dev/null || echo "")" "$LESSONS_HEADER")
            while IFS= read -r line; do
              [[ "$line" == '- **'* ]] || continue
              # Unchanged by this PR? Not ours to police. `if` keeps the
              # non-match in condition context — `grep … && continue` would
              # return 1 as the statement's status and `set -e` would abort.
              if printf '%s\n' "$BASE_SECTION" | grep -Fxq -- "$line"; then
                continue
              fi
              [[ "$line" == *"Test: "* || "$line" == *"Tests: "* ]] || continue
              n=${#line}
              if (( n > MAX_CHARS )); then
                VIOLATIONS=$((VIOLATIONS + 1))
                echo "::error file=${path}::lessons bullet is ${n} chars > ${MAX_CHARS} and already cites a paired test: ${line:0:90}…"
              fi
            done <<<"$HEAD_SECTION"
          done
          if (( VIOLATIONS > 0 )); then
            {
              echo "::error::${VIOLATIONS} test-backed lessons bullet(s) over the ${MAX_CHARS}-char cap."
              echo "::error::The paired test is the control; the bullet is recall. Keep RULE + detection + date tag"
              echo "::error::in the lessons file and move the narrative verbatim to the archive (docs/lessons.md),"
              echo "::error::where the date tag is the grep key. Bullets you did not touch are not gated."
            }
            exit 1
          fi
          echo "PASS: no test-backed bullet added or edited by this PR exceeds ${MAX_CHARS} chars"
