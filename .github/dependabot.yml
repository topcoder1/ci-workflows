# Originally generated by bootstrap-dependabot-config.sh (which skips repos that
# already have this file, so hand edits here stick).
# Pairs with the dependabot-auto-merge.yml workflow.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # anthropics/claude-code-action gets its OWN group, never the routine
      # minor-and-patch batch: its bumps change the tool surface of the
      # `review / Claude Review` lane, a REQUIRED check on ~49 repos. #136
      # (1.0.181 -> 1.0.190, merged 2026-08-14 as a routine minor bump) put the
      # CLI's multi-agent /code-review fan-out in front of every reviewer and
      # multiplied per-review cost 5-8x for two days (ci-workflows#165). A
      # standalone PR is reviewed as what it is; the merge runbook (README ->
      # claude-review.yml -> guardrails) says what to watch afterwards.
      # Groups are first-match, so this one is listed first AND excluded
      # from the batch below.
      claude-code-action:
        patterns: ["anthropics/claude-code-action"]
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["anthropics/claude-code-action"]
