[project]
name = "ci-workflows-selftest"
version = "0.0.0"
description = "Self-test fixtures for ci-workflows reusable workflows. Not a published package."
requires-python = ">=3.13"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["selftest*"]

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest",
    "pytest-cov",
    # check_draft_gate_triggers.py parses workflow YAML rather than grepping it:
    # the transitive draft gate lives in a called reusable, so the caller has no
    # `draft` text to grep for. Without this declared, `uv run pytest` dies at
    # COLLECTION with ModuleNotFoundError and takes the whole selftest suite with it.
    "pyyaml",
]

[tool.ruff.lint]
# Declare the rule set instead of inheriting ruff's built-in defaults, which
# are NOT stable across releases: 0.16 widened the default selection, and
# dotclaude's unchanged tests/ tree went from clean to 25 errors on that bump
# alone (dotclaude#186). lint.yml pins `ruff_version` so local and CI agree on
# a version; declaring the rules here is the other half — it keeps a future
# pin bump from silently re-scoping what this repo enforces. Without it, this
# repo trips the very ::warning:: its own ruff job now emits.
# These four are ruff's pre-0.16 defaults — the set this repo already passed.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["selftest"]

[tool.coverage.run]
source = ["selftest"]
omit = ["selftest/test_*.py"]
